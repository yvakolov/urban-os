                window.DATA = {"blocks": {"title": "Оформление свидетельства об утверждении архитектурно-градостроительного решения объекта капитального строительства", "shortTitle": "Свидетельство об утверждении АГР", "terms": {"term": "", "termComment": "", "terms": [{"term": "20 рабочих дней", "termComment": "Общий срок предоставления государственной услуги включает срок межведомственного информационного взаимодействия, а также межведомственного согласования в процессе предоставления государственной услуги и не может превышать:- 10 рабочих дней - для объектов окружного значения;- 20 рабочих дней - для объектов городского значения;- 15 рабочих дней - в случае обращения за предоставлением государственной услуги Московского фонда реновации жилой застройки, организации, являющейся стороной по договору о приобретении будущих объектов недвижимости, создаваемых в многоквартирных домах в целях реализации Программы реновации жилищного фонда в городе Москве, заключенному с Московским фондом реновации жилой застройки, для объектов капитального строительства, проектирование, реконструкция и (или) строительство которых осуществляется в целях реализации Программы реновации жилищного фонда в городе Москве, или в случае обращения за предоставлением государственной услуги Московского фонда защиты прав граждан - участников долевого строительства.", "displayOrder": 1}]}, "payments": {"free": true, "freeComments": "", "payments": null}, "responsibleOrganization": "ДГП", "responsibleOrganizationExtId": "2591", "participants": [{"organizationExtId": "2591", "organization": "Департамент градостроительной политики города Москвы", "participantType": null, "participantTypeExtId": "", "webresource": "http://mos.ru/dgp/"}], "communicationForms": null, "recipientCategories": [{"extId": "3", "name": "ИП", "displayOrder": 1, "comments": "<div>Правообладатели земельных участков, в отношении которых проведен государственный кадастровый учет и выдан градостроительный план земельного участка (в случае представления на утверждение архитектурно-градостроительного решения объекта капитального строительства, не являющегося линейным объектом).<br></div><div>При наличии действующего проекта планировки территории и (или) градостроительного плана земельного участка (в случае представления на утверждение архитектурно-градостроительного решения объекта капитального строительства, являющегося линейным объектом).<br></div>", "communicationForms": [{"extId": "1", "value": "Mos.ru", "action": "REQUEST"}, {"extId": "1", "value": "Mos.ru", "action": "RESPONSE"}, {"extId": "2", "value": "Лично в ведомство", "action": "RESPONSE"}]}, {"extId": "4", "name": "Представитель", "displayOrder": 5, "comments": "Интересы заявителей могут представлять уполномоченные ими в установленном порядке юридические лица или физические лица, зарегистрированные в качестве индивидуальных предпринимателей.Прием запросов и иных документов, необходимых для предоставления государственной услуги, от уполномоченных заявителем представителей, являющихся физическими лицами (не зарегистрированными в качестве индивидуальных предпринимателей), не предусмотрен.", "communicationForms": [{"extId": "1", "value": "Mos.ru", "action": "REQUEST"}, {"extId": "1", "value": "Mos.ru", "action": "RESPONSE"}, {"extId": "2", "value": "Лично в ведомство", "action": "RESPONSE"}]}, {"extId": "1", "name": "ФЛ", "displayOrder": 2, "comments": "<div>Правообладатели земельных участков, в отношении которых проведен государственный кадастровый учет и выдан градостроительный план земельного участка (в случае представления на утверждение архитектурно-градостроительного решения объекта капитального строительства, не являющегося линейным объектом).<br></div><div>При наличии действующего проекта планировки территории и (или) градостроительного плана земельного участка (в случае представления на утверждение архитектурно-градостроительного решения объекта капитального строительства, являющегося линейным объектом).<br></div>", "communicationForms": [{"extId": "1", "value": "Mos.ru", "action": "REQUEST"}, {"extId": "1", "value": "Mos.ru", "action": "RESPONSE"}, {"extId": "2", "value": "Лично в ведомство", "action": "RESPONSE"}]}, {"extId": "2", "name": "ЮЛ", "displayOrder": 3, "comments": "<div>Правообладатели земельных участков, в отношении которых проведен государственный кадастровый учет и выдан градостроительный план земельного участка (в случае представления на утверждение архитектурно-градостроительного решения объекта капитального строительства, не являющегося линейным объектом).<br></div><div>При наличии действующего проекта планировки территории и (или) градостроительного плана земельного участка (в случае представления на утверждение архитектурно-градостроительного решения объекта капитального строительства, являющегося линейным объектом).<br></div>", "communicationForms": [{"extId": "1", "value": "Mos.ru", "action": "REQUEST"}, {"extId": "1", "value": "Mos.ru", "action": "RESPONSE"}, {"extId": "2", "value": "Лично в ведомство", "action": "RESPONSE"}]}, {"extId": "2", "name": "ЮЛ", "displayOrder": 4, "comments": "Государственные учреждения города Москвы, подведомственные органам исполнительной власти города Москвы, государственные унитарные предприятия города Москвы, находящиеся в ведомственном подчинении органов исполнительной власти города Москвы, Московский фонд реновации жилой застройки, Московский фонд защиты прав граждан - участников долевого строительства, автономная некоммерческая организация \"Развитие социальной инфраструктуры\", автономная некоммерческая организация \"Развитие спортивных и инфраструктурных объектов\", организации, являющиеся стороной по договору о приобретении будущих объектов недвижимости, создаваемых в многоквартирных домах в целях реализации Программы реновации жилищного фонда в городе Москве, заключенному с Московским фондом реновации жилой застройки, в отношении земельных участков, государственная собственность на которые не разграничена, и при наличии схемы расположения земельного участка или земельных участков на кадастровом плане территории, и (или) проекта межевания территории, и (или) действующего градостроительного плана земельного участка.", "communicationForms": [{"extId": "1", "value": "Mos.ru", "action": "REQUEST"}, {"extId": "1", "value": "Mos.ru", "action": "RESPONSE"}, {"extId": "2", "value": "Лично в ведомство", "action": "RESPONSE"}]}], "recipientCategoriesCustom": "", "incomingDocuments": [{"inDocumentType": "Обязательный", "title": "Запрос (заявление) на предоставление государственной услуги", "workDocComments": "<div><div style=\"text-align: left;\">Запрос оформляется посредством внесения соответствующих сведений, указанных в приложении 2 к Административному регламенту, в интерактивную форму запроса на Портале.<br></div><br></div>", "displayOrder": 1, "classifierDocSource": "Запрос (заявление)", "sample": {"extId": "6480a56e-b433-44af-87c1-40fed998e051", "fileName": "Состав сведений АГР.pdf", "fileType": "", "size": "", "blobData": null}, "template": null}, {"inDocumentType": "Обязательный", "title": "Материалы архитектурно-градостроительного решения объекта капитального строительства", "workDocComments": "<div style=\"text-align: left;\">Состав и требования к материалам, указанным в настоящем пункте, установлены приложением к Административному регламенту.<br></div><div><div style=\"text-align:justify\">Электронные образы документа направляются в виде файлов в формате PDF, за исключением файлов низкополигональных трехмерных цифровых моделей объекта, которые направляются в виде файлов в формате FBX в составе ZIP архива, и высокополигональных трехмерных цифровых моделей объекта - FBX, PNG, GeoJSON в составе ZIP архива.<br></div><br></div>", "displayOrder": 2, "classifierDocSource": "Документ", "sample": {"extId": "16b2015b-fe0f-4e11-84c5-93ac22308270", "fileName": "Состав материалов АГР и требования к ним.pdf", "fileType": "", "size": "", "blobData": null}, "template": null}, {"inDocumentType": "Необязательный для Заявителя, запрашивается ОИВ в рамках межведомственного информационного взаимодействия", "title": "Гражданско-правовые договоры, подтверждающие право заявителя на земельный участок, находящийся в собственности города Москвы", "workDocComments": "<div>Документ, получаемый уполномоченным должностным лицом (работником) Департамента с использованием межведомственного информационного взаимодействия. Заявитель вправе представить указанный документ по собственной инициативе. <br></div>", "displayOrder": 3, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Обязательный", "title": "Документ, подтверждающий полномочия лица действовать от имени заявителя (представителя заявителя), являющегося юридическим лицом, подписанный усиленной квалифицированной электронной подписью правомочного должностного лица организации, за исключением обращения за предоставлением государственной услуги лица, имеющего право действовать без доверенности от имени юридического лица (в случае обращения за предоставлением государственной услуги лица от имени заявителя, являющегося юридическим лицом)", "workDocComments": "<div><div style=\"text-align: left;\">Электронные образы документа направляются в форматах ZIP, PDF, XML.<br></div><div style=\"text-align: left;\">Электронные копии (электронные образы) документа должны быть подписаны усиленной квалифицированной электронной подписью доверителя или нотариуса.\n<br></div><br></div>", "displayOrder": 4, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Обязательный", "title": "Схема планировочной организации земельного участка, совмещенная со схемой транспортной организации территории", "workDocComments": "<div>Документ, предоставляемый заявителем (пункт 2.5.1.1.6 Административного регламента).<br></div><div>Электронные образы документа направляются в виде файлов в формате IFC и (или) XML в составе ZIP архива.<br><br><br><br></div>", "displayOrder": 5, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Необязательный для Заявителя, запрашивается ОИВ в рамках межведомственного информационного взаимодействия", "title": "Выписка из Единого государственного реестра недвижимости об основных характеристиках и зарегистрированных правах на объект недвижимости в отношении объектов, поставленных на кадастровый учет", "workDocComments": "<div>Документ, получаемый уполномоченным должностным лицом (работником) Департамента с использованием межведомственного информационного взаимодействия. Заявитель вправе представить указанный документ по собственной инициативе.<br></div>", "displayOrder": 6, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Обязательный", "title": "Схемы планов первого и неповторяющихся этажей", "workDocComments": "<div style=\"text-align: left;\">Документ, предоставляемый заявителем (пункт 2.5.1.1.7 Администратвиного регламента).<br></div><div style=\"text-align: left;\"><div>Электронные образы документа направляются в виде файлов в формате IFC и (или) XML в составе ZIP архива.<br><div><br></div><br></div><br></div>", "displayOrder": 7, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Необязательный для Заявителя, запрашивается ОИВ в рамках межведомственного информационного взаимодействия", "title": "Схема расположения земельного участка или земельных участков на кадастровом плане территории и (или) проект межевания территории", "workDocComments": "<div>Документ, получаемый уполномоченным должностным лицом (работником) Департамента с использованием межведомственного информационного взаимодействия. Заявитель вправе представить указанный документ по собственной инициативе.<br></div>", "displayOrder": 8, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Обязательный", "title": "Правоустанавливающие документы на земельный участок в случае представления на утверждение архитектурно-градостроительного решения объекта капитального строительства, не являющегося линейным объектом (при отсутствии в Едином государственном реестре недвижимости сведений о зарегистрированных правах на объект недвижимости, а также в случаях, если в соответствии с законодательством Российской Федерации права на объекты недвижимости не подлежат регистрации в Едином государственном реестре недвижимости и в случае обращения за предоставлением государственной услуги заявителей, указанных в пункте 2.4.1.1 Административного регламента)", "workDocComments": "<div style=\"text-align: left;\">Электронные образы документа направляются в виде файлов в одном из следующих форматов: PDF, ZIP архив. <br></div><div style=\"text-align: left;\"><br></div><div style=\"text-align: left;\"><br></div><div style=\"text-align: left;\"><br></div>", "displayOrder": 9, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Обязательный", "title": "Схемы разрезов и фасадов здания", "workDocComments": "<div><div style=\"text-align: left;\">Документ, предоставляемый заявителем (пункт 2.5.1.1.9 Административного регламента).<div>Электронные образы документа направляются в виде файлов в формате IFC и (или) XML в составе ZIP архива.<div><br></div><br></div><br></div><br></div>", "displayOrder": 10, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Обязательный", "title": "Таблица расчета суммарной поэтажной площади в габаритах наружных стен жилой и нежилой застройки, включающая расчет площади квартир (без балконов, лоджий и террас), наземной площади нежилой застройки, площади квартир и встроенно-пристроенных помещений", "workDocComments": "<div style=\"text-align: left;\">Документ, предоставляемый заявителем (пункт 2.5.1.1.8 Административного регламента).<br></div><div style=\"text-align: left;\"><div>Электронныей образ документа направляется в виде таблицы расчета суммарной поэтажной площади в габаритах наружных стен жилой и нежилой застройки (для жилой застройки производится расчет жилой и нежилой части), включающей расчет площади квартир (без балконов, лоджий и террас), наземной площади нежилой застройки, площади квартир и встроенно-пристроенных помещений, в формате XML.<div><br></div><br></div><br></div>", "displayOrder": 11, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Обязательный", "title": "Документ, подтверждающий полномочия представителя действовать от имени заявителя (в случае обращения за предоставлением государственной услуги представителя заявителя)", "workDocComments": "<div>Электронные образы документа направляются в форматах ZIP, PDF, XML.<br>Электронные копии (электронные образы) документа должны быть подписаны усиленной квалифицированной электронной подписью доверителя или нотариуса.<br></div>", "displayOrder": 12, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Необязательный для Заявителя, запрашивается ОИВ в рамках межведомственного информационного взаимодействия", "title": "Выписка из Единого государственного реестра юридических лиц в случае подачи запроса от юридического лица", "workDocComments": "<div><div>Документ, получаемый уполномоченным должностным лицом Департамента\nс использованием межведомственного информационного взаимодействия. Заявитель\nвправе представить указанный документ по собственной инициативе.<br></div><br></div>", "displayOrder": 13, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Необязательный для Заявителя, запрашивается ОИВ в рамках межведомственного информационного взаимодействия", "title": "Выписка из Единого государственного реестра индивидуальных предпринимателей в случае подачи запроса от физического лица, зарегистрированного в качестве индивидуального предпринимателя", "workDocComments": "<div><div>Документ, получаемый уполномоченным должностным лицом Департамента\nс использованием межведомственного информационного взаимодействия. Заявитель\nвправе представить указанный документ по собственной инициативе<br></div><br></div>", "displayOrder": 14, "classifierDocSource": "Документ", "sample": null, "template": null}, {"inDocumentType": "Обязательный", "title": "Согласие на обработку персональных данных", "workDocComments": "<div>Электронные образы направляются в формате PDF.</div>", "displayOrder": 15, "classifierDocSource": "Согласие", "sample": null, "template": null}], "brochure": null, "scenarios": [{"title": "Решение об отказе в предоставлении государственной услуги с обоснованием причин отказа с приложением заключений Департамента культурного наследия города Москвы, Комитета по туризму города Москвы и Департамента градостроительной политики города Москвы по результатам рассмотрения материалов архитектурно-градостроительного решения объекта (при наличии таких заключений)", "type": "", "comments": "", "outDocuments": []}, {"title": "Свидетельство об утверждении архитектурно-градостроительного решения объекта капитального строительства с приложением заключений Департамента культурного наследия города Москвы, Комитета по туризму города Москвы и Департамента градостроительной политики города Москвы по результатам рассмотрения материалов архитектурно-градостроительного решения объекта (при наличии таких заключений)", "type": "", "comments": "", "outDocuments": []}], "groundsOfRefusal": [{"title": "Основания для отказа в приеме документов", "description": "", "docs": null, "descriptions": [{"description": "Запрос и иные документы, необходимые для предоставления государственной услуги, не соответствуют требованиям, установленным правовыми актами Российской Федерации, правовыми актами города Москвы, Едиными требованиями и Административным регламентом.", "displayOrder": 1, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Представленные документы утратили силу, в случае если срок действия документа указан в самом документе либо определен законодательством, а также в иных случаях, предусмотренных законодательством Российской Федерации, правовыми актами города Москвы.", "displayOrder": 2, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Заявителем представлен неполный комплект документов, указанных в пункте 2.5.1.1 Административного регламента.", "displayOrder": 3, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Подача запроса от имени заявителя не уполномоченным на то лицом.", "displayOrder": 4, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Запрос и иные документы, необходимые для предоставления государственной услуги, подписаны с использованием электронной подписи, не принадлежащей лицу, подавшему запрос.", "displayOrder": 5, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Электронные копии (электронные образы) документов, необходимых для предоставления государственной услуги, не поддаются прочтению и (или) не соответствуют требованиям к форматам их предоставления.", "displayOrder": 6, "pauseTerm": "", "pauseTermMeasureUnit": ""}]}, {"title": "Основания для отказа в предоставлении услуги", "description": "", "docs": null, "descriptions": [{"description": "Запрос и иные документы, необходимые для предоставления государственной услуги, не соответствуют требованиям, установленным правовыми актами Российской Федерации, правовыми актами города Москвы, Едиными требованиями и Административным регламентом, если указанные обстоятельства были установлены в процессе обработки документов и информации, необходимых для предоставления государственной услуги.", "displayOrder": 1, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Представление документов, утративших силу, в случае если срок действия документа указан в самом документе либо определен законодательством, а также в иных случаях, предусмотренных законодательством Российской Федерации, правовыми актами города Москвы, если указанные обстоятельства были установлены в процессе обработки документов и информации, необходимых для предоставления государственной услуги.", "displayOrder": 2, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Наличие в документах и информации, необходимых для предоставления государственной услуги, противоречивых либо недостоверных сведений, если указанные обстоятельства были установлены в процессе обработки документов и информации, необходимых для предоставления государственной услуги.", "displayOrder": 3, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Обращение за предоставлением государственной услуги лица, не являющегося получателем государственной услуги в соответствии с Административным регламентом, если указанные обстоятельства были установлены в процессе обработки документов и информации, необходимых для предоставления государственной услуги.", "displayOrder": 4, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Несоответствие местоположения заявленного земельного участка территориальному делению города Москвы, установленному Законом города Москвы от 5 июля 1995 г. N 13-47 \"О территориальном делении города Москвы\".", "displayOrder": 5, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Несоответствие представленных заявителем материалов архитектурно-градостроительного решения объекта капитального строительства функциональному назначению и местоположению объекта с учетом объемно-планировочных, композиционных, силуэтных, архитектурно-художественных, декоративно-пластических, стилистических, колористических характеристик объекта, а также сложившихся особенностей территории и характеристик окружающей застройки, результатам цифрового мастер-планирования территории города Москвы (после утверждения алгоритмов цифрового мастер-планирования территории города Москвы в установленном порядке).", "displayOrder": 6, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Несоответствие представленных заявителем материалов архитектурно-градостроительного решения объекта капитального строительства сведениям, указанным в градостроительном плане земельного участка, либо действующему проекту планировки территории, и (или) градостроительному плану земельного участка (для линейных объектов), и (или) требованиям, установленным приложением к Административному регламенту, и (или) требованиям законодательства Российской Федерации, законов и иных нормативных правовых актов города Москвы.", "displayOrder": 7, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Отрицательное заключение Департамента культурного наследия города Москвы на материалы архитектурно-градостроительного решения объекта капитального строительства.", "displayOrder": 8, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Несоответствие представленных заявителем материалов архитектурно-градостроительного решения объекта капитального строительства требованиям, установленным Департаментом культурного наследия города Москвы в отношении рассматриваемого земельного участка и (или) материалов архитектурно-градостроительного решения объекта капитального строительства.", "displayOrder": 9, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Подача заявителем запроса в отношении объекта капитального строительства, на который в Департаменте градостроительной политики города Москвы на исполнении имеется направленный ранее запрос данным заявителем (при условии, что представленные заявителем документы, необходимые для предоставления государственной услуги, идентичны по составу и содержанию документам, ранее представленным заявителем).", "displayOrder": 10, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Обращение за предоставлением государственной услуги в отношении объекта капитального строительства, для которого не требуется утверждение архитектурно-градостроительного решения в соответствии с Положением об утверждении архитектурно-градостроительных решений объектов капитального строительства в городе Москве, утвержденным настоящим постановлением.", "displayOrder": 11, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Поступление от органов государственной власти, указанных в пункте 2.3.2 Административного регламента, информации об отсутствии у них документов и информации, предусмотренных пунктом 2.5.1.2 Административного регламента, если указанные документы не были представлены заявителем по собственной инициативе.", "displayOrder": 12, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Подача заявителем запроса в отношении объекта капитального строительства, материалы архитектурно-градостроительного решения которого разработаны в соответствии с градостроительным планом земельного участка, содержащим информацию, срок использования которой для подготовки проектной документации, выдачи разрешения на строительство истек в соответствии с нормативными правовыми актами Российской Федерации и города Москвы (в том числе в период предоставления государственной услуги).", "displayOrder": 13, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Отрицательное заключение Комитета по туризму города Москвы на материалы архитектурно-градостроительного решения объекта капитального строительства.", "displayOrder": 14, "pauseTerm": "", "pauseTermMeasureUnit": ""}, {"description": "Поступление документов или информации, подтверждающих отсутствие заключенного инфраструктурного договора (если его заключение предусмотрено правовым актом Правительства Москвы) или нарушение очередности (этапов) завершения мероприятий по строительству объектов инфраструктуры, предусмотренной заключенным в порядке, установленном Правительством Москвы, инфраструктурным договором.", "displayOrder": 15, "pauseTerm": "", "pauseTermMeasureUnit": ""}]}], "groundsOfStop": [], "appealDescription": "<div align=\"center\" style=\"text-align: center; text-align: center; text-align: center;\"><br></div><div class=\"MsoNormal\" align=\"center\" style=\"text-align: center; text-align: center; text-align: center; margin-bottom:0cm;margin-bottom:.0001pt;\ntext-align:center;line-height:normal;mso-outline-level:1;mso-layout-grid-align:\nnone;text-autospace:none\"><br></div><div class=\"MsoNormal\" style=\"text-align: left;\">1.\nЗаявитель имеет право подать в досудебном (внесудебном) порядке жалобу на\nпринятые (совершенные) при предоставлении государственной услуги решения и\n(или) действия (бездействие) Департамента градостроительной политики город Москвы (далее - Департамент) и его должностных лиц, государственных\nгражданских служащих.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">2.\nПодача и рассмотрение жалоб осуществляется в порядке, установленном главой 2.1\nФедерального закона от 27 июля 2010 г. N 210-ФЗ \"Об организации\nпредоставления государственных и муниципальных услуг\", приложением 6\nк постановлению Правительства Москвы от 15 ноября 2011 г. N 546-ПП \"О\nпредоставлении государственных и муниципальных услуг в городе Москве\", Административным\nрегламентом предоставления государственной услуги.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.\nЗаявители могут обратиться с жалобами в случаях:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.1.\nНарушения срока регистрации запроса и иных документов, необходимых для\nпредоставления государственной услуги.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.2.\nТребования от заявителя:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.2.1.\nДокументов или информации либо осуществления действий, предоставление или\nосуществление которых не предусмотрено нормативными правовыми актами Российской\nФедерации и города Москвы для предоставления государственных услуг, в том числе\nдокументов, получаемых с использованием межведомственного информационного\nвзаимодействия.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.2.2.\nОбращения за предоставлением услуг, не включенных в утвержденный Правительством\nМосквы перечень услуг, которые являются необходимыми и обязательными для\nпредоставления государственных услуг.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.2.3.\nВнесения платы за предоставление государственной услуги, не предусмотренной\nнормативными правовыми актами Российской Федерации и города Москвы.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.2.4.\nДокументов или информации, отсутствие и (или) недостоверность которых не\nуказывались при первоначальном отказе в приеме документов, необходимых для\nпредоставления государственной услуги, либо в предоставлении государственной\nуслуги, за исключением случаев, предусмотренных пунктом 4 части 1\nстатьи 7 Федерального закона от 27 июля 2010 г. N 210-ФЗ \"Об\nорганизации предоставления государственных и муниципальных услуг\".<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.3.\nНарушения срока предоставления государственной услуги.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.4.\nОтказа заявителю:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.4.1.\nВ приеме документов, предоставление которых предусмотрено нормативными\nправовыми актами Российской Федерации и города Москвы для предоставления\nгосударственной услуги, по основаниям, не предусмотренным нормативными правовыми\nактами Российской Федерации и города Москвы.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.4.2.\nВ предоставлении государственной услуги по основаниям, не предусмотренным\nнормативными правовыми актами Российской Федерации и города Москвы.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.4.3.\nВ исправлении допущенных опечаток и ошибок в выданных в результате\nпредоставления государственной услуги документах либо в случае нарушения\nустановленного срока таких исправлений.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">3.5.\nИных нарушений порядка предоставления государственной услуги, установленного\nнормативными правовыми актами Российской Федерации и города Москвы.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">4. Жалобы на решения и (или) действия\n(бездействие) должностных лиц, государственных гражданских служащих Департамента рассматриваются руководителем (уполномоченным заместителем руководителя)\nДепартамента.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">Жалобы\nна решения и (или) действия (бездействие) руководителя Департамента, в том числе на\nрешения, принятые им или его заместителем по поступившим в досудебном\n(внесудебном) порядке жалобам, направляются в Правительство Москвы и\nрассматриваются заместителем Мэра Москвы в Правительстве Москвы по вопросам\nградостроительной политики и строительства.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">5.\nЖалобы на решения и (или) действия (бездействие) Департамента, должностных лиц,\nгосударственных гражданских служащих Департамента, совершенные при осуществлении в\nотношении юридических лиц и индивидуальных предпринимателей, являющихся\nсубъектами градостроительных отношений, процедур, включенных в исчерпывающие\nперечни процедур в сферах строительства, утвержденные Правительством Российской\nФедерации в соответствии с частью 2 статьи 6\nГрадостроительного кодекса Российской Федерации, могут быть также поданы\nуказанными лицами в антимонопольный орган в порядке, установленном\nантимонопольным законодательством Российской Федерации.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">6.\nЖалобы могут быть поданы в органы исполнительной власти города Москвы,\nуполномоченные на рассмотрение жалоб в соответствии с Административным\nрегламентом предоставления государственной услуги (далее - органы,\nуполномоченные на рассмотрение жалоб), в письменной форме на бумажном носителе,\nв электронной форме одним из следующих способов:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">6.1.\nПри личном обращении заявителя (представителя заявителя).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">6.2.\nПочтовым отправлением.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">6.3.\nС использованием Портала (при наличии технической возможности).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">6.4.\nС использованием официальных сайтов органов и организаций, уполномоченных на\nрассмотрение жалоб, в информационно-телекоммуникационной сети Интернет.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.\nЖалоба должна содержать:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.1.\nНаименование уполномоченного на рассмотрение жалобы органа государственной\nвласти либо должность и (или) фамилию, имя и отчество (при наличии)\nсоответствующего должностного лица, которому направляется жалоба.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.2.\nНаименование органа исполнительной власти города Москвы либо должность и (или)\nфамилию, имя и отчество (при наличии) должностного лица, государственного\nслужащего, работника, решения и действия (бездействие) которых обжалуются.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.3.\nФамилию, имя, отчество (при наличии), сведения о месте жительства заявителя -\nфизического лица, в том числе зарегистрированного в качестве индивидуального\nпредпринимателя, либо наименование, сведения о месте нахождения заявителя -\nюридического лица, а также номер (номера) контактного телефона, адрес (адреса)\nэлектронной почты (при наличии) и почтовый адрес, по которым должен быть\nнаправлен ответ заявителю.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.4.\nУтратил силу с 14 марта 2023 года. - Постановление\nПравительства Москвы от 14.03.2023 N 394-ПП.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.5.\nСведения о решениях и (или) действиях (бездействии), являющихся предметом\nобжалования.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.6.\nДоводы, на основании которых заявитель не согласен с обжалуемыми решениями и\nдействиями (бездействием). Заявителем могут быть представлены документы (при\nналичии), подтверждающие доводы заявителя, либо их копии.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.7.\nУтратил силу с 14 марта 2023 года. - Постановление\nПравительства Москвы от 14.03.2023 N 394-ПП.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.8.\nПеречень прилагаемых к жалобе документов (при наличии).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">7.9.\nУтратил силу с 14 марта 2023 года. - Постановление\nПравительства Москвы от 14.03.2023 N 394-ПП.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">8.\nЖалоба должна быть подписана заявителем (его представителем). В случае подачи\nжалобы при личном обращении заявитель (представитель заявителя) должен\nпредставить документ, удостоверяющий личность.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">Полномочия\nпредставителя на подписание жалобы должны быть подтверждены доверенностью,\nоформленной в соответствии с законодательством Российской Федерации.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">Полномочия\nлица, действующего от имени организации без доверенности на основании закона,\nиных нормативных правовых актов и учредительных документов, подтверждаются\nдокументами, удостоверяющими его служебное положение, а также учредительными\nдокументами организации.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">Статус\nи полномочия законных представителей физического лица подтверждаются\nдокументами, предусмотренными федеральными законами.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">9.\nПоступившая жалоба подлежит регистрации в срок не позднее рабочего дня,\nследующего за днем поступления.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">10.\nМаксимальный срок рассмотрения жалобы составляет 15 рабочих дней со дня ее\nрегистрации. Срок рассмотрения жалобы составляет 5 рабочих дней со дня ее\nрегистрации в случаях обжалования заявителем:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">10.1.\nОтказа в приеме документов.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">10.2.\nОтказа в исправлении опечаток и ошибок, допущенных в документах, выданных в\nрезультате предоставления государственной услуги.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">10.3.\nНарушения срока исправлений опечаток и ошибок.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">11.\nПо результатам рассмотрения жалобы принимается решение об удовлетворении жалобы\n(полностью или в части) либо об отказе в удовлетворении жалобы.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.\nРешение должно содержать:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.1.\nНаименование органа или организации, рассмотревших жалобу, должность, фамилию,\nимя, отчество (при наличии) должностного лица, принявшего решение по жалобе.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.2.\nРеквизиты решения (номер, дату, место принятия).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.3.\nФамилию, имя, отчество (при наличии), сведения о месте жительства заявителя -\nфизического лица либо наименование, сведения о месте нахождения заявителя -\nюридического лица.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.4.\nФамилию, имя, отчество (при наличии), сведения о месте жительства представителя\nзаявителя, подавшего жалобу от имени заявителя.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.5.\nСпособ подачи и дату регистрации жалобы, ее регистрационный номер.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.6.\nПредмет жалобы (сведения об обжалуемых решениях, действиях, бездействии).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.7.\nУстановленные при рассмотрении жалобы обстоятельства и доказательства, их\nподтверждающие.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.8.\nПравовые основания для принятия решения по жалобе со ссылкой на подлежащие\nприменению нормативные правовые акты Российской Федерации и города Москвы.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.9.\nПринятое по жалобе решение (вывод об удовлетворении жалобы или об отказе в ее\nудовлетворении).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.10.\nМеры по устранению выявленных нарушений и сроки их выполнения (в случае\nудовлетворения жалобы).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.11.\nИнформацию о действиях, осуществляемых органом исполнительной власти города\nМосквы, предоставляющим государственную услугу, в целях незамедлительного\nустранения выявленных нарушений при оказании государственной услуги, а также\nизвинения за доставленные неудобства и информацию о дальнейших действиях,\nкоторые необходимо совершить заявителю в целях получения государственной услуги\n(в случае удовлетворения жалобы).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.12.\nАргументированные разъяснения о причинах принятого решения (в случае отказа в\nудовлетворении жалобы).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.13.\nПорядок обжалования решения.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">12.14.\nПодпись уполномоченного должностного лица.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">13.\nРешение оформляется в письменном виде с использованием официальных бланков.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">14.\nК числу указываемых в решении мер по устранению выявленных нарушений в том\nчисле относятся:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">14.1.\nОтмена ранее принятых решений (полностью или в части).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">14.2.\nОбеспечение приема и регистрации запроса и иных документов, необходимых для\nпредоставления государственной услуги (при уклонении или необоснованном отказе\nв приеме документов, необходимых для предоставления государственной услуги).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">14.3.\nОбеспечение оформления и выдачи заявителю результата предоставления\nгосударственной услуги (при уклонении или необоснованном отказе в\nпредоставлении государственной услуги).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">14.4.\nИсправление опечаток и ошибок, допущенных в документах, выданных в результате\nпредоставления государственной услуги.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">14.5.\nВозврат заявителю денежных средств, взимание которых не предусмотрено нормативными\nправовыми актами Российской Федерации и города Москвы.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">15.\nОрган или организация, уполномоченные на рассмотрение жалобы, отказывают в ее\nудовлетворении в случаях:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">15.1.\nПризнания обжалуемых решений и действий (бездействия) законными, не нарушающими\nправ и свобод заявителя.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">15.2.\nПодачи жалобы лицом, полномочия которого не подтверждены в порядке,\nустановленном нормативными правовыми актами Российской Федерации и города\nМосквы.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">15.3.\nОтсутствия у заявителя права на получение государственной услуги.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">15.4.\nНаличия:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">15.4.1.\nВступившего в законную силу решения суда по жалобе заявителя с тождественными\nпредметом и основаниями.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">15.4.2.\nРешения по жалобе, принятого ранее в досудебном (внесудебном) порядке в\nотношении того же заявителя и по тому же предмету жалобы (за исключением\nслучаев обжалования ранее принятых решений в вышестоящий орган).<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">16.\nЖалоба подлежит оставлению без ответа по существу в случаях:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">16.1.\nНаличия в жалобе нецензурных либо оскорбительных выражений, угроз жизни, здоровью\nи имуществу должностных лиц, а также членов их семей.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">16.2.\nЕсли текст жалобы (его часть), фамилия, почтовый адрес и адрес электронной\nпочты не поддаются прочтению.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">16.3.\nЕсли в жалобе не указаны фамилия заявителя (представителя заявителя) или почтовый\nадрес и адрес электронной почты, по которым должен быть направлен ответ.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">16.4.\nЕсли в орган или организацию, уполномоченные на рассмотрение жалобы, поступило\nходатайство заявителя (представителя заявителя) об отзыве жалобы до вынесения\nрешения по жалобе.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">17.\nРешение об удовлетворении жалобы и об отказе в удовлетворении жалобы\nнаправляется заявителю (представителю заявителя) в срок не позднее одного\nрабочего дня, следующего за днем его принятия, по почтовому адресу, указанному\nв жалобе. По желанию заявителя решение также направляется на указанный в жалобе\nадрес электронной почты (в форме электронного документа, подписанного\nэлектронной подписью уполномоченного должностного лица). В таком же порядке\nзаявителю (представителю заявителя) направляется решение по жалобе, в которой\nдля ответа указан только адрес электронной почты, а почтовый адрес отсутствует\nили не поддается прочтению.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">18.\nВ случае оставления жалобы без ответа по существу заявителю (его представителю)\nнаправляется в срок не позднее рабочего дня, следующего за днем регистрации\nжалобы, письменное мотивированное уведомление с указанием оснований (за\nисключением случаев, когда в жалобе не указаны почтовый адрес и адрес\nэлектронной почты для ответа или они не поддаются прочтению). Уведомление направляется\nв порядке, установленном для направления решения по жалобе.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">19.\nЖалоба, поданная с нарушением правил о компетенции, установленных пунктом\n5.4 Административного регламента предоставления государственной\nуслуги, направляется в срок не позднее рабочего дня, следующего за днем ее\nрегистрации, в орган, уполномоченный на рассмотрение жалобы, с одновременным\nписьменным уведомлением заявителя (его представителя) о переадресации жалобы\n(за исключением случаев, когда в жалобе не указаны почтовый адрес и адрес\nэлектронной почты для ответа или они не поддаются прочтению). Уведомление\nнаправляется в порядке, установленном для направления решения по жалобе.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">20.\nПодача жалобы в досудебном (внесудебном) порядке не исключает права заявителя\n(представителя заявителя) на одновременную или последующую подачу жалобы в суд.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">21.\nИнформирование заявителей о судебном и досудебном (внесудебном) порядке\nобжалования решений и (или) действий (бездействия), совершенных при\nпредоставлении государственной услуги, должно осуществляться путем:<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">21.1.\nРазмещения соответствующей информации на Портале, официальном сайте Департамента в\nинформационно-телекоммуникационной сети Интернет и стендах в помещениях Департамента.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">21.2.\nКонсультирования заявителей, в том числе по телефону, электронной почте, при\nличном приеме.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">22.\nВ случае установления в ходе или по результатам рассмотрения жалобы признаков\nсостава административного правонарушения или преступления должностное лицо,\nнаделенное полномочиями по рассмотрению жалобы, незамедлительно направляет\nимеющиеся материалы в органы прокуратуры.<br></div><div class=\"MsoNormal\" style=\"text-align: left;\">При\nвыявлении нарушений порядка предоставления государственных услуг города Москвы,\nответственность за совершение которых установлена Кодексом\nгорода Москвы об административных правонарушениях, должностное лицо, наделенное\nполномочиями по рассмотрению жалобы, также должно направить копии имеющихся\nматериалов в Главное контрольное управление города Москвы в течение двух\nрабочих дней, следующих за днем вынесения решения по жалобе (но не позднее\nрабочего дня, следующего за днем истечения установленного федеральным\nзаконодательством срока рассмотрения жалоб на нарушения порядка предоставления государственных\nуслуг).<br></div><div class=\"MsoNormal\" align=\"center\" style=\"text-align: center; text-align: center; text-align: center; margin-bottom:0cm;margin-bottom:.0001pt;\ntext-align:center;line-height:normal;mso-outline-level:1;mso-layout-grid-align:\nnone;text-autospace:none\">\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n<br></div><div class=\"MsoNormal\"><br></div><div><br></div>", "offDocs": [{"title": "О главном архитекторе города Москвы", "type": "", "sn": "33-РМ", "approvalDate": "2013-01-23", "documentClass": "Прочее", "docs": null, "displayOrder": 2}, {"title": "О Базовом регистре информации, необходимой для предоставления государственных услуг в городе Москве", "type": "", "sn": "376-РП", "approvalDate": "2011-05-12", "documentClass": "Прочее", "docs": null, "displayOrder": 3}, {"title": "Постановление Правительства РФ от 26.03.2016 № 236 \"О требованиях к предоставлению в электро
