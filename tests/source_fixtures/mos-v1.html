ss=\"MsoNormal\" style=\"text-align: left;\">3.2.1.\n\u0414\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0438\u043b\u0438 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0438 \u043b\u0438\u0431\u043e \u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043b\u0435\u043d\u0438\u044f \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0439, \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u0438\u043b\u0438\n\u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043b\u0435\u043d\u0438\u0435 \u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u043d\u0435 \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043e \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u043c\u0438 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u043c\u0438 \u0430\u043a\u0442\u0430\u043c\u0438 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439\n\u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b \u0434\u043b\u044f \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u0443\u0441\u043b\u0443\u0433, \u0432 \u0442\u043e\u043c \u0447\u0438\u0441\u043b\u0435\n\u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432, \u043f\u043e\u043b\u0443\u0447\u0430\u0435\u043c\u044b\u0445 \u0441 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u043c\u0435\u0436\u0432\u0435\u0434\u043e\u043c\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0433\u043e \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0433\u043e\n\u0432\u0437\u0430\u0438\u043c\u043e\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.2.2.\n\u041e\u0431\u0440\u0430\u0449\u0435\u043d\u0438\u044f \u0437\u0430 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435\u043c \u0443\u0441\u043b\u0443\u0433, \u043d\u0435 \u0432\u043a\u043b\u044e\u0447\u0435\u043d\u043d\u044b\u0445 \u0432 \u0443\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u043d\u044b\u0439 \u041f\u0440\u0430\u0432\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u043c\n\u041c\u043e\u0441\u043a\u0432\u044b \u043f\u0435\u0440\u0435\u0447\u0435\u043d\u044c \u0443\u0441\u043b\u0443\u0433, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u044f\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u044b\u043c\u0438 \u0438 \u043e\u0431\u044f\u0437\u0430\u0442\u0435\u043b\u044c\u043d\u044b\u043c\u0438 \u0434\u043b\u044f\n\u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u0443\u0441\u043b\u0443\u0433.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.2.3.\n\u0412\u043d\u0435\u0441\u0435\u043d\u0438\u044f \u043f\u043b\u0430\u0442\u044b \u0437\u0430 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438, \u043d\u0435 \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043d\u043e\u0439\n\u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u043c\u0438 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u043c\u0438 \u0430\u043a\u0442\u0430\u043c\u0438 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.2.4.\n\u0414\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432 \u0438\u043b\u0438 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0438, \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0435 \u0438 (\u0438\u043b\u0438) \u043d\u0435\u0434\u043e\u0441\u0442\u043e\u0432\u0435\u0440\u043d\u043e\u0441\u0442\u044c \u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u043d\u0435\n\u0443\u043a\u0430\u0437\u044b\u0432\u0430\u043b\u0438\u0441\u044c \u043f\u0440\u0438 \u043f\u0435\u0440\u0432\u043e\u043d\u0430\u0447\u0430\u043b\u044c\u043d\u043e\u043c \u043e\u0442\u043a\u0430\u0437\u0435 \u0432 \u043f\u0440\u0438\u0435\u043c\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432, \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u044b\u0445 \u0434\u043b\u044f\n\u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438, \u043b\u0438\u0431\u043e \u0432 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0438 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439\n\u0443\u0441\u043b\u0443\u0433\u0438, \u0437\u0430 \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435\u043c \u0441\u043b\u0443\u0447\u0430\u0435\u0432, \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043d\u044b\u0445 \u043f\u0443\u043d\u043a\u0442\u043e\u043c 4 \u0447\u0430\u0441\u0442\u0438 1\n\u0441\u0442\u0430\u0442\u044c\u0438 7 \u0424\u0435\u0434\u0435\u0440\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0437\u0430\u043a\u043e\u043d\u0430 \u043e\u0442 27 \u0438\u044e\u043b\u044f 2010 \u0433. N 210-\u0424\u0417 \"\u041e\u0431\n\u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u0438 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u0438 \u043c\u0443\u043d\u0438\u0446\u0438\u043f\u0430\u043b\u044c\u043d\u044b\u0445 \u0443\u0441\u043b\u0443\u0433\".<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.3.\n\u041d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u044f \u0441\u0440\u043e\u043a\u0430 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.4.\n\u041e\u0442\u043a\u0430\u0437\u0430 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044e:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.4.1.\n\u0412 \u043f\u0440\u0438\u0435\u043c\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432, \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043e \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u043c\u0438\n\u043f\u0440\u0430\u0432\u043e\u0432\u044b\u043c\u0438 \u0430\u043a\u0442\u0430\u043c\u0438 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b \u0434\u043b\u044f \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f\n\u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438, \u043f\u043e \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u044f\u043c, \u043d\u0435 \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043d\u044b\u043c \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u043c\u0438 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u043c\u0438\n\u0430\u043a\u0442\u0430\u043c\u0438 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.4.2.\n\u0412 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0438 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438 \u043f\u043e \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u044f\u043c, \u043d\u0435 \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043d\u044b\u043c\n\u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u043c\u0438 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u043c\u0438 \u0430\u043a\u0442\u0430\u043c\u0438 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.4.3.\n\u0412 \u0438\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0438 \u0434\u043e\u043f\u0443\u0449\u0435\u043d\u043d\u044b\u0445 \u043e\u043f\u0435\u0447\u0430\u0442\u043e\u043a \u0438 \u043e\u0448\u0438\u0431\u043e\u043a \u0432 \u0432\u044b\u0434\u0430\u043d\u043d\u044b\u0445 \u0432 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0435\n\u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u0445 \u043b\u0438\u0431\u043e \u0432 \u0441\u043b\u0443\u0447\u0430\u0435 \u043d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u044f\n\u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u043e\u0433\u043e \u0441\u0440\u043e\u043a\u0430 \u0442\u0430\u043a\u0438\u0445 \u0438\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0439.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">3.5.\n\u0418\u043d\u044b\u0445 \u043d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u0439 \u043f\u043e\u0440\u044f\u0434\u043a\u0430 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438, \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u043e\u0433\u043e\n\u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u043c\u0438 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u043c\u0438 \u0430\u043a\u0442\u0430\u043c\u0438 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">4. \u0416\u0430\u043b\u043e\u0431\u044b \u043d\u0430 \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u0438 (\u0438\u043b\u0438) \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f\n(\u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435) \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u043d\u044b\u0445 \u043b\u0438\u0446, \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u0433\u0440\u0430\u0436\u0434\u0430\u043d\u0441\u043a\u0438\u0445 \u0441\u043b\u0443\u0436\u0430\u0449\u0438\u0445 \u0414\u0435\u043f\u0430\u0440\u0442\u0430\u043c\u0435\u043d\u0442\u0430 \u0440\u0430\u0441\u0441\u043c\u0430\u0442\u0440\u0438\u0432\u0430\u044e\u0442\u0441\u044f \u0440\u0443\u043a\u043e\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u0435\u043c (\u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u044b\u043c \u0437\u0430\u043c\u0435\u0441\u0442\u0438\u0442\u0435\u043b\u0435\u043c \u0440\u0443\u043a\u043e\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044f)\n\u0414\u0435\u043f\u0430\u0440\u0442\u0430\u043c\u0435\u043d\u0442\u0430.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">\u0416\u0430\u043b\u043e\u0431\u044b\n\u043d\u0430 \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u0438 (\u0438\u043b\u0438) \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f (\u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435) \u0440\u0443\u043a\u043e\u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044f \u0414\u0435\u043f\u0430\u0440\u0442\u0430\u043c\u0435\u043d\u0442\u0430, \u0432 \u0442\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u043d\u0430\n\u0440\u0435\u0448\u0435\u043d\u0438\u044f, \u043f\u0440\u0438\u043d\u044f\u0442\u044b\u0435 \u0438\u043c \u0438\u043b\u0438 \u0435\u0433\u043e \u0437\u0430\u043c\u0435\u0441\u0442\u0438\u0442\u0435\u043b\u0435\u043c \u043f\u043e \u043f\u043e\u0441\u0442\u0443\u043f\u0438\u0432\u0448\u0438\u043c \u0432 \u0434\u043e\u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c\n(\u0432\u043d\u0435\u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c) \u043f\u043e\u0440\u044f\u0434\u043a\u0435 \u0436\u0430\u043b\u043e\u0431\u0430\u043c, \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u044e\u0442\u0441\u044f \u0432 \u041f\u0440\u0430\u0432\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e \u041c\u043e\u0441\u043a\u0432\u044b \u0438\n\u0440\u0430\u0441\u0441\u043c\u0430\u0442\u0440\u0438\u0432\u0430\u044e\u0442\u0441\u044f \u0437\u0430\u043c\u0435\u0441\u0442\u0438\u0442\u0435\u043b\u0435\u043c \u041c\u044d\u0440\u0430 \u041c\u043e\u0441\u043a\u0432\u044b \u0432 \u041f\u0440\u0430\u0432\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0435 \u041c\u043e\u0441\u043a\u0432\u044b \u043f\u043e \u0432\u043e\u043f\u0440\u043e\u0441\u0430\u043c\n\u0433\u0440\u0430\u0434\u043e\u0441\u0442\u0440\u043e\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u043f\u043e\u043b\u0438\u0442\u0438\u043a\u0438 \u0438 \u0441\u0442\u0440\u043e\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">5.\n\u0416\u0430\u043b\u043e\u0431\u044b \u043d\u0430 \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u0438 (\u0438\u043b\u0438) \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f (\u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435) \u0414\u0435\u043f\u0430\u0440\u0442\u0430\u043c\u0435\u043d\u0442\u0430, \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u043d\u044b\u0445 \u043b\u0438\u0446,\n\u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u0445 \u0433\u0440\u0430\u0436\u0434\u0430\u043d\u0441\u043a\u0438\u0445 \u0441\u043b\u0443\u0436\u0430\u0449\u0438\u0445 \u0414\u0435\u043f\u0430\u0440\u0442\u0430\u043c\u0435\u043d\u0442\u0430, \u0441\u043e\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044b\u0435 \u043f\u0440\u0438 \u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043b\u0435\u043d\u0438\u0438 \u0432\n\u043e\u0442\u043d\u043e\u0448\u0435\u043d\u0438\u0438 \u044e\u0440\u0438\u0434\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043b\u0438\u0446 \u0438 \u0438\u043d\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043b\u044c\u043d\u044b\u0445 \u043f\u0440\u0435\u0434\u043f\u0440\u0438\u043d\u0438\u043c\u0430\u0442\u0435\u043b\u0435\u0439, \u044f\u0432\u043b\u044f\u044e\u0449\u0438\u0445\u0441\u044f\n\u0441\u0443\u0431\u044a\u0435\u043a\u0442\u0430\u043c\u0438 \u0433\u0440\u0430\u0434\u043e\u0441\u0442\u0440\u043e\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u043e\u0442\u043d\u043e\u0448\u0435\u043d\u0438\u0439, \u043f\u0440\u043e\u0446\u0435\u0434\u0443\u0440, \u0432\u043a\u043b\u044e\u0447\u0435\u043d\u043d\u044b\u0445 \u0432 \u0438\u0441\u0447\u0435\u0440\u043f\u044b\u0432\u0430\u044e\u0449\u0438\u0435\n\u043f\u0435\u0440\u0435\u0447\u043d\u0438 \u043f\u0440\u043e\u0446\u0435\u0434\u0443\u0440 \u0432 \u0441\u0444\u0435\u0440\u0430\u0445 \u0441\u0442\u0440\u043e\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430, \u0443\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u043d\u044b\u0435 \u041f\u0440\u0430\u0432\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u043c \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439\n\u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0432 \u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0438 \u0441 \u0447\u0430\u0441\u0442\u044c\u044e 2 \u0441\u0442\u0430\u0442\u044c\u0438 6\n\u0413\u0440\u0430\u0434\u043e\u0441\u0442\u0440\u043e\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e \u043a\u043e\u0434\u0435\u043a\u0441\u0430 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438, \u043c\u043e\u0433\u0443\u0442 \u0431\u044b\u0442\u044c \u0442\u0430\u043a\u0436\u0435 \u043f\u043e\u0434\u0430\u043d\u044b\n\u0443\u043a\u0430\u0437\u0430\u043d\u043d\u044b\u043c\u0438 \u043b\u0438\u0446\u0430\u043c\u0438 \u0432 \u0430\u043d\u0442\u0438\u043c\u043e\u043d\u043e\u043f\u043e\u043b\u044c\u043d\u044b\u0439 \u043e\u0440\u0433\u0430\u043d \u0432 \u043f\u043e\u0440\u044f\u0434\u043a\u0435, \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u043e\u043c\n\u0430\u043d\u0442\u0438\u043c\u043e\u043d\u043e\u043f\u043e\u043b\u044c\u043d\u044b\u043c \u0437\u0430\u043a\u043e\u043d\u043e\u0434\u0430\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u043c \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">6.\n\u0416\u0430\u043b\u043e\u0431\u044b \u043c\u043e\u0433\u0443\u0442 \u0431\u044b\u0442\u044c \u043f\u043e\u0434\u0430\u043d\u044b \u0432 \u043e\u0440\u0433\u0430\u043d\u044b \u0438\u0441\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0432\u043b\u0430\u0441\u0442\u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b,\n\u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u044b\u0435 \u043d\u0430 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0435 \u0436\u0430\u043b\u043e\u0431 \u0432 \u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0438 \u0441 \u0410\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043d\u044b\u043c\n\u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u043e\u043c \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438 (\u0434\u0430\u043b\u0435\u0435 - \u043e\u0440\u0433\u0430\u043d\u044b,\n\u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u044b\u0435 \u043d\u0430 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0435 \u0436\u0430\u043b\u043e\u0431), \u0432 \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u043e\u0439 \u0444\u043e\u0440\u043c\u0435 \u043d\u0430 \u0431\u0443\u043c\u0430\u0436\u043d\u043e\u043c \u043d\u043e\u0441\u0438\u0442\u0435\u043b\u0435,\n\u0432 \u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439 \u0444\u043e\u0440\u043c\u0435 \u043e\u0434\u043d\u0438\u043c \u0438\u0437 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0445 \u0441\u043f\u043e\u0441\u043e\u0431\u043e\u0432:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">6.1.\n\u041f\u0440\u0438 \u043b\u0438\u0447\u043d\u043e\u043c \u043e\u0431\u0440\u0430\u0449\u0435\u043d\u0438\u0438 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f (\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">6.2.\n\u041f\u043e\u0447\u0442\u043e\u0432\u044b\u043c \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435\u043c.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">6.3.\n\u0421 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u041f\u043e\u0440\u0442\u0430\u043b\u0430 (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438 \u0442\u0435\u0445\u043d\u0438\u0447\u0435\u0441\u043a\u043e\u0439 \u0432\u043e\u0437\u043c\u043e\u0436\u043d\u043e\u0441\u0442\u0438).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">6.4.\n\u0421 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u043e\u0444\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0445 \u0441\u0430\u0439\u0442\u043e\u0432 \u043e\u0440\u0433\u0430\u043d\u043e\u0432 \u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u0439, \u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u044b\u0445 \u043d\u0430\n\u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0435 \u0436\u0430\u043b\u043e\u0431, \u0432 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u043e\u043d\u043d\u043e-\u0442\u0435\u043b\u0435\u043a\u043e\u043c\u043c\u0443\u043d\u0438\u043a\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0439 \u0441\u0435\u0442\u0438 \u0418\u043d\u0442\u0435\u0440\u043d\u0435\u0442.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.\n\u0416\u0430\u043b\u043e\u0431\u0430 \u0434\u043e\u043b\u0436\u043d\u0430 \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0442\u044c:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.1.\n\u041d\u0430\u0438\u043c\u0435\u043d\u043e\u0432\u0430\u043d\u0438\u0435 \u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u043e\u0433\u043e \u043d\u0430 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0435 \u0436\u0430\u043b\u043e\u0431\u044b \u043e\u0440\u0433\u0430\u043d\u0430 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439\n\u0432\u043b\u0430\u0441\u0442\u0438 \u043b\u0438\u0431\u043e \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u044c \u0438 (\u0438\u043b\u0438) \u0444\u0430\u043c\u0438\u043b\u0438\u044e, \u0438\u043c\u044f \u0438 \u043e\u0442\u0447\u0435\u0441\u0442\u0432\u043e (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438)\n\u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0443\u044e\u0449\u0435\u0433\u043e \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u043d\u043e\u0433\u043e \u043b\u0438\u0446\u0430, \u043a\u043e\u0442\u043e\u0440\u043e\u043c\u0443 \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0436\u0430\u043b\u043e\u0431\u0430.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.2.\n\u041d\u0430\u0438\u043c\u0435\u043d\u043e\u0432\u0430\u043d\u0438\u0435 \u043e\u0440\u0433\u0430\u043d\u0430 \u0438\u0441\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0432\u043b\u0430\u0441\u0442\u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b \u043b\u0438\u0431\u043e \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u044c \u0438 (\u0438\u043b\u0438)\n\u0444\u0430\u043c\u0438\u043b\u0438\u044e, \u0438\u043c\u044f \u0438 \u043e\u0442\u0447\u0435\u0441\u0442\u0432\u043e (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438) \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u043d\u043e\u0433\u043e \u043b\u0438\u0446\u0430, \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0433\u043e\n\u0441\u043b\u0443\u0436\u0430\u0449\u0435\u0433\u043e, \u0440\u0430\u0431\u043e\u0442\u043d\u0438\u043a\u0430, \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u0438 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f (\u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435) \u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u043e\u0431\u0436\u0430\u043b\u0443\u044e\u0442\u0441\u044f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.3.\n\u0424\u0430\u043c\u0438\u043b\u0438\u044e, \u0438\u043c\u044f, \u043e\u0442\u0447\u0435\u0441\u0442\u0432\u043e (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438), \u0441\u0432\u0435\u0434\u0435\u043d\u0438\u044f \u043e \u043c\u0435\u0441\u0442\u0435 \u0436\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f -\n\u0444\u0438\u0437\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u043b\u0438\u0446\u0430, \u0432 \u0442\u043e\u043c \u0447\u0438\u0441\u043b\u0435 \u0437\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0433\u043e \u0432 \u043a\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0438\u043d\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043b\u044c\u043d\u043e\u0433\u043e\n\u043f\u0440\u0435\u0434\u043f\u0440\u0438\u043d\u0438\u043c\u0430\u0442\u0435\u043b\u044f, \u043b\u0438\u0431\u043e \u043d\u0430\u0438\u043c\u0435\u043d\u043e\u0432\u0430\u043d\u0438\u0435, \u0441\u0432\u0435\u0434\u0435\u043d\u0438\u044f \u043e \u043c\u0435\u0441\u0442\u0435 \u043d\u0430\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f -\n\u044e\u0440\u0438\u0434\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u043b\u0438\u0446\u0430, \u0430 \u0442\u0430\u043a\u0436\u0435 \u043d\u043e\u043c\u0435\u0440 (\u043d\u043e\u043c\u0435\u0440\u0430) \u043a\u043e\u043d\u0442\u0430\u043a\u0442\u043d\u043e\u0433\u043e \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0430, \u0430\u0434\u0440\u0435\u0441 (\u0430\u0434\u0440\u0435\u0441\u0430)\n\u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439 \u043f\u043e\u0447\u0442\u044b (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438) \u0438 \u043f\u043e\u0447\u0442\u043e\u0432\u044b\u0439 \u0430\u0434\u0440\u0435\u0441, \u043f\u043e \u043a\u043e\u0442\u043e\u0440\u044b\u043c \u0434\u043e\u043b\u0436\u0435\u043d \u0431\u044b\u0442\u044c\n\u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d \u043e\u0442\u0432\u0435\u0442 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044e.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.4.\n\u0423\u0442\u0440\u0430\u0442\u0438\u043b \u0441\u0438\u043b\u0443 \u0441 14 \u043c\u0430\u0440\u0442\u0430 2023 \u0433\u043e\u0434\u0430. - \u041f\u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435\n\u041f\u0440\u0430\u0432\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u041c\u043e\u0441\u043a\u0432\u044b \u043e\u0442 14.03.2023 N 394-\u041f\u041f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.5.\n\u0421\u0432\u0435\u0434\u0435\u043d\u0438\u044f \u043e \u0440\u0435\u0448\u0435\u043d\u0438\u044f\u0445 \u0438 (\u0438\u043b\u0438) \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f\u0445 (\u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0438), \u044f\u0432\u043b\u044f\u044e\u0449\u0438\u0445\u0441\u044f \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u043e\u043c\n\u043e\u0431\u0436\u0430\u043b\u043e\u0432\u0430\u043d\u0438\u044f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.6.\n\u0414\u043e\u0432\u043e\u0434\u044b, \u043d\u0430 \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u0438 \u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044c \u043d\u0435 \u0441\u043e\u0433\u043b\u0430\u0441\u0435\u043d \u0441 \u043e\u0431\u0436\u0430\u043b\u0443\u0435\u043c\u044b\u043c\u0438 \u0440\u0435\u0448\u0435\u043d\u0438\u044f\u043c\u0438 \u0438\n\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f\u043c\u0438 (\u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435\u043c). \u0417\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u0435\u043c \u043c\u043e\u0433\u0443\u0442 \u0431\u044b\u0442\u044c \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u044b \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u044b (\u043f\u0440\u0438\n\u043d\u0430\u043b\u0438\u0447\u0438\u0438), \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u044e\u0449\u0438\u0435 \u0434\u043e\u0432\u043e\u0434\u044b \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f, \u043b\u0438\u0431\u043e \u0438\u0445 \u043a\u043e\u043f\u0438\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.7.\n\u0423\u0442\u0440\u0430\u0442\u0438\u043b \u0441\u0438\u043b\u0443 \u0441 14 \u043c\u0430\u0440\u0442\u0430 2023 \u0433\u043e\u0434\u0430. - \u041f\u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435\n\u041f\u0440\u0430\u0432\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u041c\u043e\u0441\u043a\u0432\u044b \u043e\u0442 14.03.2023 N 394-\u041f\u041f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.8.\n\u041f\u0435\u0440\u0435\u0447\u0435\u043d\u044c \u043f\u0440\u0438\u043b\u0430\u0433\u0430\u0435\u043c\u044b\u0445 \u043a \u0436\u0430\u043b\u043e\u0431\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432 (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">7.9.\n\u0423\u0442\u0440\u0430\u0442\u0438\u043b \u0441\u0438\u043b\u0443 \u0441 14 \u043c\u0430\u0440\u0442\u0430 2023 \u0433\u043e\u0434\u0430. - \u041f\u043e\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435\n\u041f\u0440\u0430\u0432\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u041c\u043e\u0441\u043a\u0432\u044b \u043e\u0442 14.03.2023 N 394-\u041f\u041f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">8.\n\u0416\u0430\u043b\u043e\u0431\u0430 \u0434\u043e\u043b\u0436\u043d\u0430 \u0431\u044b\u0442\u044c \u043f\u043e\u0434\u043f\u0438\u0441\u0430\u043d\u0430 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u0435\u043c (\u0435\u0433\u043e \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u0435\u043c). \u0412 \u0441\u043b\u0443\u0447\u0430\u0435 \u043f\u043e\u0434\u0430\u0447\u0438\n\u0436\u0430\u043b\u043e\u0431\u044b \u043f\u0440\u0438 \u043b\u0438\u0447\u043d\u043e\u043c \u043e\u0431\u0440\u0430\u0449\u0435\u043d\u0438\u0438 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044c (\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044c \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f) \u0434\u043e\u043b\u0436\u0435\u043d\n\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u044c \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442, \u0443\u0434\u043e\u0441\u0442\u043e\u0432\u0435\u0440\u044f\u044e\u0449\u0438\u0439 \u043b\u0438\u0447\u043d\u043e\u0441\u0442\u044c.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">\u041f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0438\u044f\n\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044f \u043d\u0430 \u043f\u043e\u0434\u043f\u0438\u0441\u0430\u043d\u0438\u0435 \u0436\u0430\u043b\u043e\u0431\u044b \u0434\u043e\u043b\u0436\u043d\u044b \u0431\u044b\u0442\u044c \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u044b \u0434\u043e\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0441\u0442\u044c\u044e,\n\u043e\u0444\u043e\u0440\u043c\u043b\u0435\u043d\u043d\u043e\u0439 \u0432 \u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0438 \u0441 \u0437\u0430\u043a\u043e\u043d\u043e\u0434\u0430\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u043e\u043c \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">\u041f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0438\u044f\n\u043b\u0438\u0446\u0430, \u0434\u0435\u0439\u0441\u0442\u0432\u0443\u044e\u0449\u0435\u0433\u043e \u043e\u0442 \u0438\u043c\u0435\u043d\u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u0438 \u0431\u0435\u0437 \u0434\u043e\u0432\u0435\u0440\u0435\u043d\u043d\u043e\u0441\u0442\u0438 \u043d\u0430 \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u0438 \u0437\u0430\u043a\u043e\u043d\u0430,\n\u0438\u043d\u044b\u0445 \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u0445 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u0445 \u0430\u043a\u0442\u043e\u0432 \u0438 \u0443\u0447\u0440\u0435\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432, \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u044e\u0442\u0441\u044f\n\u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438, \u0443\u0434\u043e\u0441\u0442\u043e\u0432\u0435\u0440\u044f\u044e\u0449\u0438\u043c\u0438 \u0435\u0433\u043e \u0441\u043b\u0443\u0436\u0435\u0431\u043d\u043e\u0435 \u043f\u043e\u043b\u043e\u0436\u0435\u043d\u0438\u0435, \u0430 \u0442\u0430\u043a\u0436\u0435 \u0443\u0447\u0440\u0435\u0434\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u043c\u0438\n\u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">\u0421\u0442\u0430\u0442\u0443\u0441\n\u0438 \u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0438\u044f \u0437\u0430\u043a\u043e\u043d\u043d\u044b\u0445 \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u0435\u0439 \u0444\u0438\u0437\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u043b\u0438\u0446\u0430 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u044e\u0442\u0441\u044f\n\u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u043c\u0438, \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043d\u044b\u043c\u0438 \u0444\u0435\u0434\u0435\u0440\u0430\u043b\u044c\u043d\u044b\u043c\u0438 \u0437\u0430\u043a\u043e\u043d\u0430\u043c\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">9.\n\u041f\u043e\u0441\u0442\u0443\u043f\u0438\u0432\u0448\u0430\u044f \u0436\u0430\u043b\u043e\u0431\u0430 \u043f\u043e\u0434\u043b\u0435\u0436\u0438\u0442 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0432 \u0441\u0440\u043e\u043a \u043d\u0435 \u043f\u043e\u0437\u0434\u043d\u0435\u0435 \u0440\u0430\u0431\u043e\u0447\u0435\u0433\u043e \u0434\u043d\u044f,\n\u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0433\u043e \u0437\u0430 \u0434\u043d\u0435\u043c \u043f\u043e\u0441\u0442\u0443\u043f\u043b\u0435\u043d\u0438\u044f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">10.\n\u041c\u0430\u043a\u0441\u0438\u043c\u0430\u043b\u044c\u043d\u044b\u0439 \u0441\u0440\u043e\u043a \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u044f \u0436\u0430\u043b\u043e\u0431\u044b \u0441\u043e\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u0442 15 \u0440\u0430\u0431\u043e\u0447\u0438\u0445 \u0434\u043d\u0435\u0439 \u0441\u043e \u0434\u043d\u044f \u0435\u0435\n\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438. \u0421\u0440\u043e\u043a \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u044f \u0436\u0430\u043b\u043e\u0431\u044b \u0441\u043e\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u0442 5 \u0440\u0430\u0431\u043e\u0447\u0438\u0445 \u0434\u043d\u0435\u0439 \u0441\u043e \u0434\u043d\u044f \u0435\u0435\n\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0432 \u0441\u043b\u0443\u0447\u0430\u044f\u0445 \u043e\u0431\u0436\u0430\u043b\u043e\u0432\u0430\u043d\u0438\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u0435\u043c:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">10.1.\n\u041e\u0442\u043a\u0430\u0437\u0430 \u0432 \u043f\u0440\u0438\u0435\u043c\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">10.2.\n\u041e\u0442\u043a\u0430\u0437\u0430 \u0432 \u0438\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0438 \u043e\u043f\u0435\u0447\u0430\u0442\u043e\u043a \u0438 \u043e\u0448\u0438\u0431\u043e\u043a, \u0434\u043e\u043f\u0443\u0449\u0435\u043d\u043d\u044b\u0445 \u0432 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u0445, \u0432\u044b\u0434\u0430\u043d\u043d\u044b\u0445 \u0432\n\u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0435 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">10.3.\n\u041d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u044f \u0441\u0440\u043e\u043a\u0430 \u0438\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0439 \u043e\u043f\u0435\u0447\u0430\u0442\u043e\u043a \u0438 \u043e\u0448\u0438\u0431\u043e\u043a.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">11.\n\u041f\u043e \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430\u043c \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u044f \u0436\u0430\u043b\u043e\u0431\u044b \u043f\u0440\u0438\u043d\u0438\u043c\u0430\u0435\u0442\u0441\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u043e\u0431 \u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b\n(\u043f\u043e\u043b\u043d\u043e\u0441\u0442\u044c\u044e \u0438\u043b\u0438 \u0432 \u0447\u0430\u0441\u0442\u0438) \u043b\u0438\u0431\u043e \u043e\u0431 \u043e\u0442\u043a\u0430\u0437\u0435 \u0432 \u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.\n\u0420\u0435\u0448\u0435\u043d\u0438\u0435 \u0434\u043e\u043b\u0436\u043d\u043e \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0442\u044c:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.1.\n\u041d\u0430\u0438\u043c\u0435\u043d\u043e\u0432\u0430\u043d\u0438\u0435 \u043e\u0440\u0433\u0430\u043d\u0430 \u0438\u043b\u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u0438, \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u0432\u0448\u0438\u0445 \u0436\u0430\u043b\u043e\u0431\u0443, \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u044c, \u0444\u0430\u043c\u0438\u043b\u0438\u044e,\n\u0438\u043c\u044f, \u043e\u0442\u0447\u0435\u0441\u0442\u0432\u043e (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438) \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u043d\u043e\u0433\u043e \u043b\u0438\u0446\u0430, \u043f\u0440\u0438\u043d\u044f\u0432\u0448\u0435\u0433\u043e \u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.2.\n\u0420\u0435\u043a\u0432\u0438\u0437\u0438\u0442\u044b \u0440\u0435\u0448\u0435\u043d\u0438\u044f (\u043d\u043e\u043c\u0435\u0440, \u0434\u0430\u0442\u0443, \u043c\u0435\u0441\u0442\u043e \u043f\u0440\u0438\u043d\u044f\u0442\u0438\u044f).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.3.\n\u0424\u0430\u043c\u0438\u043b\u0438\u044e, \u0438\u043c\u044f, \u043e\u0442\u0447\u0435\u0441\u0442\u0432\u043e (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438), \u0441\u0432\u0435\u0434\u0435\u043d\u0438\u044f \u043e \u043c\u0435\u0441\u0442\u0435 \u0436\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f -\n\u0444\u0438\u0437\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u043b\u0438\u0446\u0430 \u043b\u0438\u0431\u043e \u043d\u0430\u0438\u043c\u0435\u043d\u043e\u0432\u0430\u043d\u0438\u0435, \u0441\u0432\u0435\u0434\u0435\u043d\u0438\u044f \u043e \u043c\u0435\u0441\u0442\u0435 \u043d\u0430\u0445\u043e\u0436\u0434\u0435\u043d\u0438\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f -\n\u044e\u0440\u0438\u0434\u0438\u0447\u0435\u0441\u043a\u043e\u0433\u043e \u043b\u0438\u0446\u0430.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.4.\n\u0424\u0430\u043c\u0438\u043b\u0438\u044e, \u0438\u043c\u044f, \u043e\u0442\u0447\u0435\u0441\u0442\u0432\u043e (\u043f\u0440\u0438 \u043d\u0430\u043b\u0438\u0447\u0438\u0438), \u0441\u0432\u0435\u0434\u0435\u043d\u0438\u044f \u043e \u043c\u0435\u0441\u0442\u0435 \u0436\u0438\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044f\n\u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f, \u043f\u043e\u0434\u0430\u0432\u0448\u0435\u0433\u043e \u0436\u0430\u043b\u043e\u0431\u0443 \u043e\u0442 \u0438\u043c\u0435\u043d\u0438 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.5.\n\u0421\u043f\u043e\u0441\u043e\u0431 \u043f\u043e\u0434\u0430\u0447\u0438 \u0438 \u0434\u0430\u0442\u0443 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b, \u0435\u0435 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u043e\u043d\u043d\u044b\u0439 \u043d\u043e\u043c\u0435\u0440.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.6.\n\u041f\u0440\u0435\u0434\u043c\u0435\u0442 \u0436\u0430\u043b\u043e\u0431\u044b (\u0441\u0432\u0435\u0434\u0435\u043d\u0438\u044f \u043e\u0431 \u043e\u0431\u0436\u0430\u043b\u0443\u0435\u043c\u044b\u0445 \u0440\u0435\u0448\u0435\u043d\u0438\u044f\u0445, \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f\u0445, \u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0438).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.7.\n\u0423\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u044b\u0435 \u043f\u0440\u0438 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b \u043e\u0431\u0441\u0442\u043e\u044f\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430 \u0438 \u0434\u043e\u043a\u0430\u0437\u0430\u0442\u0435\u043b\u044c\u0441\u0442\u0432\u0430, \u0438\u0445\n\u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0430\u044e\u0449\u0438\u0435.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.8.\n\u041f\u0440\u0430\u0432\u043e\u0432\u044b\u0435 \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u044f \u0434\u043b\u044f \u043f\u0440\u0438\u043d\u044f\u0442\u0438\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435 \u0441\u043e \u0441\u0441\u044b\u043b\u043a\u043e\u0439 \u043d\u0430 \u043f\u043e\u0434\u043b\u0435\u0436\u0430\u0449\u0438\u0435\n\u043f\u0440\u0438\u043c\u0435\u043d\u0435\u043d\u0438\u044e \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u0435 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u0435 \u0430\u043a\u0442\u044b \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.9.\n\u041f\u0440\u0438\u043d\u044f\u0442\u043e\u0435 \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435 \u0440\u0435\u0448\u0435\u043d\u0438\u0435 (\u0432\u044b\u0432\u043e\u0434 \u043e\u0431 \u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b \u0438\u043b\u0438 \u043e\u0431 \u043e\u0442\u043a\u0430\u0437\u0435 \u0432 \u0435\u0435\n\u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u0438).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.10.\n\u041c\u0435\u0440\u044b \u043f\u043e \u0443\u0441\u0442\u0440\u0430\u043d\u0435\u043d\u0438\u044e \u0432\u044b\u044f\u0432\u043b\u0435\u043d\u043d\u044b\u0445 \u043d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u0439 \u0438 \u0441\u0440\u043e\u043a\u0438 \u0438\u0445 \u0432\u044b\u043f\u043e\u043b\u043d\u0435\u043d\u0438\u044f (\u0432 \u0441\u043b\u0443\u0447\u0430\u0435\n\u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u044f \u0436\u0430\u043b\u043e\u0431\u044b).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.11.\n\u0418\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044e \u043e \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f\u0445, \u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043b\u044f\u0435\u043c\u044b\u0445 \u043e\u0440\u0433\u0430\u043d\u043e\u043c \u0438\u0441\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0439 \u0432\u043b\u0430\u0441\u0442\u0438 \u0433\u043e\u0440\u043e\u0434\u0430\n\u041c\u043e\u0441\u043a\u0432\u044b, \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u044f\u044e\u0449\u0438\u043c \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u0443\u044e \u0443\u0441\u043b\u0443\u0433\u0443, \u0432 \u0446\u0435\u043b\u044f\u0445 \u043d\u0435\u0437\u0430\u043c\u0435\u0434\u043b\u0438\u0442\u0435\u043b\u044c\u043d\u043e\u0433\u043e\n\u0443\u0441\u0442\u0440\u0430\u043d\u0435\u043d\u0438\u044f \u0432\u044b\u044f\u0432\u043b\u0435\u043d\u043d\u044b\u0445 \u043d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u0439 \u043f\u0440\u0438 \u043e\u043a\u0430\u0437\u0430\u043d\u0438\u0438 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438, \u0430 \u0442\u0430\u043a\u0436\u0435\n\u0438\u0437\u0432\u0438\u043d\u0435\u043d\u0438\u044f \u0437\u0430 \u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u043d\u044b\u0435 \u043d\u0435\u0443\u0434\u043e\u0431\u0441\u0442\u0432\u0430 \u0438 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u044e \u043e \u0434\u0430\u043b\u044c\u043d\u0435\u0439\u0448\u0438\u0445 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f\u0445,\n\u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u043e \u0441\u043e\u0432\u0435\u0440\u0448\u0438\u0442\u044c \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044e \u0432 \u0446\u0435\u043b\u044f\u0445 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438\n(\u0432 \u0441\u043b\u0443\u0447\u0430\u0435 \u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u044f \u0436\u0430\u043b\u043e\u0431\u044b).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.12.\n\u0410\u0440\u0433\u0443\u043c\u0435\u043d\u0442\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u0440\u0430\u0437\u044a\u044f\u0441\u043d\u0435\u043d\u0438\u044f \u043e \u043f\u0440\u0438\u0447\u0438\u043d\u0430\u0445 \u043f\u0440\u0438\u043d\u044f\u0442\u043e\u0433\u043e \u0440\u0435\u0448\u0435\u043d\u0438\u044f (\u0432 \u0441\u043b\u0443\u0447\u0430\u0435 \u043e\u0442\u043a\u0430\u0437\u0430 \u0432\n\u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.13.\n\u041f\u043e\u0440\u044f\u0434\u043e\u043a \u043e\u0431\u0436\u0430\u043b\u043e\u0432\u0430\u043d\u0438\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u044f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">12.14.\n\u041f\u043e\u0434\u043f\u0438\u0441\u044c \u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u043e\u0433\u043e \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u043d\u043e\u0433\u043e \u043b\u0438\u0446\u0430.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">13.\n\u0420\u0435\u0448\u0435\u043d\u0438\u0435 \u043e\u0444\u043e\u0440\u043c\u043b\u044f\u0435\u0442\u0441\u044f \u0432 \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u043e\u043c \u0432\u0438\u0434\u0435 \u0441 \u0438\u0441\u043f\u043e\u043b\u044c\u0437\u043e\u0432\u0430\u043d\u0438\u0435\u043c \u043e\u0444\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u044b\u0445 \u0431\u043b\u0430\u043d\u043a\u043e\u0432.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">14.\n\u041a \u0447\u0438\u0441\u043b\u0443 \u0443\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u043c\u044b\u0445 \u0432 \u0440\u0435\u0448\u0435\u043d\u0438\u0438 \u043c\u0435\u0440 \u043f\u043e \u0443\u0441\u0442\u0440\u0430\u043d\u0435\u043d\u0438\u044e \u0432\u044b\u044f\u0432\u043b\u0435\u043d\u043d\u044b\u0445 \u043d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u0439 \u0432 \u0442\u043e\u043c\n\u0447\u0438\u0441\u043b\u0435 \u043e\u0442\u043d\u043e\u0441\u044f\u0442\u0441\u044f:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">14.1.\n\u041e\u0442\u043c\u0435\u043d\u0430 \u0440\u0430\u043d\u0435\u0435 \u043f\u0440\u0438\u043d\u044f\u0442\u044b\u0445 \u0440\u0435\u0448\u0435\u043d\u0438\u0439 (\u043f\u043e\u043b\u043d\u043e\u0441\u0442\u044c\u044e \u0438\u043b\u0438 \u0432 \u0447\u0430\u0441\u0442\u0438).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">14.2.\n\u041e\u0431\u0435\u0441\u043f\u0435\u0447\u0435\u043d\u0438\u0435 \u043f\u0440\u0438\u0435\u043c\u0430 \u0438 \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438 \u0437\u0430\u043f\u0440\u043e\u0441\u0430 \u0438 \u0438\u043d\u044b\u0445 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432, \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u044b\u0445 \u0434\u043b\u044f\n\u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438 (\u043f\u0440\u0438 \u0443\u043a\u043b\u043e\u043d\u0435\u043d\u0438\u0438 \u0438\u043b\u0438 \u043d\u0435\u043e\u0431\u043e\u0441\u043d\u043e\u0432\u0430\u043d\u043d\u043e\u043c \u043e\u0442\u043a\u0430\u0437\u0435\n\u0432 \u043f\u0440\u0438\u0435\u043c\u0435 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u043e\u0432, \u043d\u0435\u043e\u0431\u0445\u043e\u0434\u0438\u043c\u044b\u0445 \u0434\u043b\u044f \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">14.3.\n\u041e\u0431\u0435\u0441\u043f\u0435\u0447\u0435\u043d\u0438\u0435 \u043e\u0444\u043e\u0440\u043c\u043b\u0435\u043d\u0438\u044f \u0438 \u0432\u044b\u0434\u0430\u0447\u0438 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044e \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f\n\u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438 (\u043f\u0440\u0438 \u0443\u043a\u043b\u043e\u043d\u0435\u043d\u0438\u0438 \u0438\u043b\u0438 \u043d\u0435\u043e\u0431\u043e\u0441\u043d\u043e\u0432\u0430\u043d\u043d\u043e\u043c \u043e\u0442\u043a\u0430\u0437\u0435 \u0432\n\u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0438 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">14.4.\n\u0418\u0441\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043e\u043f\u0435\u0447\u0430\u0442\u043e\u043a \u0438 \u043e\u0448\u0438\u0431\u043e\u043a, \u0434\u043e\u043f\u0443\u0449\u0435\u043d\u043d\u044b\u0445 \u0432 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u0445, \u0432\u044b\u0434\u0430\u043d\u043d\u044b\u0445 \u0432 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0435\n\u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">14.5.\n\u0412\u043e\u0437\u0432\u0440\u0430\u0442 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044e \u0434\u0435\u043d\u0435\u0436\u043d\u044b\u0445 \u0441\u0440\u0435\u0434\u0441\u0442\u0432, \u0432\u0437\u0438\u043c\u0430\u043d\u0438\u0435 \u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u043d\u0435 \u043f\u0440\u0435\u0434\u0443\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u043e \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u043c\u0438\n\u043f\u0440\u0430\u0432\u043e\u0432\u044b\u043c\u0438 \u0430\u043a\u0442\u0430\u043c\u0438 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430 \u041c\u043e\u0441\u043a\u0432\u044b.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">15.\n\u041e\u0440\u0433\u0430\u043d \u0438\u043b\u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u044f, \u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u044b\u0435 \u043d\u0430 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0435 \u0436\u0430\u043b\u043e\u0431\u044b, \u043e\u0442\u043a\u0430\u0437\u044b\u0432\u0430\u044e\u0442 \u0432 \u0435\u0435\n\u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u0438 \u0432 \u0441\u043b\u0443\u0447\u0430\u044f\u0445:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">15.1.\n\u041f\u0440\u0438\u0437\u043d\u0430\u043d\u0438\u044f \u043e\u0431\u0436\u0430\u043b\u0443\u0435\u043c\u044b\u0445 \u0440\u0435\u0448\u0435\u043d\u0438\u0439 \u0438 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0439 (\u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f) \u0437\u0430\u043a\u043e\u043d\u043d\u044b\u043c\u0438, \u043d\u0435 \u043d\u0430\u0440\u0443\u0448\u0430\u044e\u0449\u0438\u043c\u0438\n\u043f\u0440\u0430\u0432 \u0438 \u0441\u0432\u043e\u0431\u043e\u0434 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">15.2.\n\u041f\u043e\u0434\u0430\u0447\u0438 \u0436\u0430\u043b\u043e\u0431\u044b \u043b\u0438\u0446\u043e\u043c, \u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0438\u044f \u043a\u043e\u0442\u043e\u0440\u043e\u0433\u043e \u043d\u0435 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043d\u044b \u0432 \u043f\u043e\u0440\u044f\u0434\u043a\u0435,\n\u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u043e\u043c \u043d\u043e\u0440\u043c\u0430\u0442\u0438\u0432\u043d\u044b\u043c\u0438 \u043f\u0440\u0430\u0432\u043e\u0432\u044b\u043c\u0438 \u0430\u043a\u0442\u0430\u043c\u0438 \u0420\u043e\u0441\u0441\u0438\u0439\u0441\u043a\u043e\u0439 \u0424\u0435\u0434\u0435\u0440\u0430\u0446\u0438\u0438 \u0438 \u0433\u043e\u0440\u043e\u0434\u0430\n\u041c\u043e\u0441\u043a\u0432\u044b.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">15.3.\n\u041e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u044f \u0443 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f \u043f\u0440\u0430\u0432\u0430 \u043d\u0430 \u043f\u043e\u043b\u0443\u0447\u0435\u043d\u0438\u0435 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">15.4.\n\u041d\u0430\u043b\u0438\u0447\u0438\u044f:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">15.4.1.\n\u0412\u0441\u0442\u0443\u043f\u0438\u0432\u0448\u0435\u0433\u043e \u0432 \u0437\u0430\u043a\u043e\u043d\u043d\u0443\u044e \u0441\u0438\u043b\u0443 \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u0441\u0443\u0434\u0430 \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f \u0441 \u0442\u043e\u0436\u0434\u0435\u0441\u0442\u0432\u0435\u043d\u043d\u044b\u043c\u0438\n\u043f\u0440\u0435\u0434\u043c\u0435\u0442\u043e\u043c \u0438 \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u044f\u043c\u0438.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">15.4.2.\n\u0420\u0435\u0448\u0435\u043d\u0438\u044f \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435, \u043f\u0440\u0438\u043d\u044f\u0442\u043e\u0433\u043e \u0440\u0430\u043d\u0435\u0435 \u0432 \u0434\u043e\u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c (\u0432\u043d\u0435\u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c) \u043f\u043e\u0440\u044f\u0434\u043a\u0435 \u0432\n\u043e\u0442\u043d\u043e\u0448\u0435\u043d\u0438\u0438 \u0442\u043e\u0433\u043e \u0436\u0435 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f \u0438 \u043f\u043e \u0442\u043e\u043c\u0443 \u0436\u0435 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0443 \u0436\u0430\u043b\u043e\u0431\u044b (\u0437\u0430 \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435\u043c\n\u0441\u043b\u0443\u0447\u0430\u0435\u0432 \u043e\u0431\u0436\u0430\u043b\u043e\u0432\u0430\u043d\u0438\u044f \u0440\u0430\u043d\u0435\u0435 \u043f\u0440\u0438\u043d\u044f\u0442\u044b\u0445 \u0440\u0435\u0448\u0435\u043d\u0438\u0439 \u0432 \u0432\u044b\u0448\u0435\u0441\u0442\u043e\u044f\u0449\u0438\u0439 \u043e\u0440\u0433\u0430\u043d).<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">16.\n\u0416\u0430\u043b\u043e\u0431\u0430 \u043f\u043e\u0434\u043b\u0435\u0436\u0438\u0442 \u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044e \u0431\u0435\u0437 \u043e\u0442\u0432\u0435\u0442\u0430 \u043f\u043e \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443 \u0432 \u0441\u043b\u0443\u0447\u0430\u044f\u0445:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">16.1.\n\u041d\u0430\u043b\u0438\u0447\u0438\u044f \u0432 \u0436\u0430\u043b\u043e\u0431\u0435 \u043d\u0435\u0446\u0435\u043d\u0437\u0443\u0440\u043d\u044b\u0445 \u043b\u0438\u0431\u043e \u043e\u0441\u043a\u043e\u0440\u0431\u0438\u0442\u0435\u043b\u044c\u043d\u044b\u0445 \u0432\u044b\u0440\u0430\u0436\u0435\u043d\u0438\u0439, \u0443\u0433\u0440\u043e\u0437 \u0436\u0438\u0437\u043d\u0438, \u0437\u0434\u043e\u0440\u043e\u0432\u044c\u044e\n\u0438 \u0438\u043c\u0443\u0449\u0435\u0441\u0442\u0432\u0443 \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u043d\u044b\u0445 \u043b\u0438\u0446, \u0430 \u0442\u0430\u043a\u0436\u0435 \u0447\u043b\u0435\u043d\u043e\u0432 \u0438\u0445 \u0441\u0435\u043c\u0435\u0439.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">16.2.\n\u0415\u0441\u043b\u0438 \u0442\u0435\u043a\u0441\u0442 \u0436\u0430\u043b\u043e\u0431\u044b (\u0435\u0433\u043e \u0447\u0430\u0441\u0442\u044c), \u0444\u0430\u043c\u0438\u043b\u0438\u044f, \u043f\u043e\u0447\u0442\u043e\u0432\u044b\u0439 \u0430\u0434\u0440\u0435\u0441 \u0438 \u0430\u0434\u0440\u0435\u0441 \u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439\n\u043f\u043e\u0447\u0442\u044b \u043d\u0435 \u043f\u043e\u0434\u0434\u0430\u044e\u0442\u0441\u044f \u043f\u0440\u043e\u0447\u0442\u0435\u043d\u0438\u044e.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">16.3.\n\u0415\u0441\u043b\u0438 \u0432 \u0436\u0430\u043b\u043e\u0431\u0435 \u043d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d\u044b \u0444\u0430\u043c\u0438\u043b\u0438\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f (\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f) \u0438\u043b\u0438 \u043f\u043e\u0447\u0442\u043e\u0432\u044b\u0439\n\u0430\u0434\u0440\u0435\u0441 \u0438 \u0430\u0434\u0440\u0435\u0441 \u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439 \u043f\u043e\u0447\u0442\u044b, \u043f\u043e \u043a\u043e\u0442\u043e\u0440\u044b\u043c \u0434\u043e\u043b\u0436\u0435\u043d \u0431\u044b\u0442\u044c \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d \u043e\u0442\u0432\u0435\u0442.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">16.4.\n\u0415\u0441\u043b\u0438 \u0432 \u043e\u0440\u0433\u0430\u043d \u0438\u043b\u0438 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u044e, \u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u044b\u0435 \u043d\u0430 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0435 \u0436\u0430\u043b\u043e\u0431\u044b, \u043f\u043e\u0441\u0442\u0443\u043f\u0438\u043b\u043e\n\u0445\u043e\u0434\u0430\u0442\u0430\u0439\u0441\u0442\u0432\u043e \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f (\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f) \u043e\u0431 \u043e\u0442\u0437\u044b\u0432\u0435 \u0436\u0430\u043b\u043e\u0431\u044b \u0434\u043e \u0432\u044b\u043d\u0435\u0441\u0435\u043d\u0438\u044f\n\u0440\u0435\u0448\u0435\u043d\u0438\u044f \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">17.\n\u0420\u0435\u0448\u0435\u043d\u0438\u0435 \u043e\u0431 \u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b \u0438 \u043e\u0431 \u043e\u0442\u043a\u0430\u0437\u0435 \u0432 \u0443\u0434\u043e\u0432\u043b\u0435\u0442\u0432\u043e\u0440\u0435\u043d\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b\n\u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044e (\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044e \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f) \u0432 \u0441\u0440\u043e\u043a \u043d\u0435 \u043f\u043e\u0437\u0434\u043d\u0435\u0435 \u043e\u0434\u043d\u043e\u0433\u043e\n\u0440\u0430\u0431\u043e\u0447\u0435\u0433\u043e \u0434\u043d\u044f, \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0433\u043e \u0437\u0430 \u0434\u043d\u0435\u043c \u0435\u0433\u043e \u043f\u0440\u0438\u043d\u044f\u0442\u0438\u044f, \u043f\u043e \u043f\u043e\u0447\u0442\u043e\u0432\u043e\u043c\u0443 \u0430\u0434\u0440\u0435\u0441\u0443, \u0443\u043a\u0430\u0437\u0430\u043d\u043d\u043e\u043c\u0443\n\u0432 \u0436\u0430\u043b\u043e\u0431\u0435. \u041f\u043e \u0436\u0435\u043b\u0430\u043d\u0438\u044e \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u0442\u0430\u043a\u0436\u0435 \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u043d\u0430 \u0443\u043a\u0430\u0437\u0430\u043d\u043d\u044b\u0439 \u0432 \u0436\u0430\u043b\u043e\u0431\u0435\n\u0430\u0434\u0440\u0435\u0441 \u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439 \u043f\u043e\u0447\u0442\u044b (\u0432 \u0444\u043e\u0440\u043c\u0435 \u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0433\u043e \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430, \u043f\u043e\u0434\u043f\u0438\u0441\u0430\u043d\u043d\u043e\u0433\u043e\n\u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439 \u043f\u043e\u0434\u043f\u0438\u0441\u044c\u044e \u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u043e\u0433\u043e \u0434\u043e\u043b\u0436\u043d\u043e\u0441\u0442\u043d\u043e\u0433\u043e \u043b\u0438\u0446\u0430). \u0412 \u0442\u0430\u043a\u043e\u043c \u0436\u0435 \u043f\u043e\u0440\u044f\u0434\u043a\u0435\n\u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044e (\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044e \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f) \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u0435 \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435, \u0432 \u043a\u043e\u0442\u043e\u0440\u043e\u0439\n\u0434\u043b\u044f \u043e\u0442\u0432\u0435\u0442\u0430 \u0443\u043a\u0430\u0437\u0430\u043d \u0442\u043e\u043b\u044c\u043a\u043e \u0430\u0434\u0440\u0435\u0441 \u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439 \u043f\u043e\u0447\u0442\u044b, \u0430 \u043f\u043e\u0447\u0442\u043e\u0432\u044b\u0439 \u0430\u0434\u0440\u0435\u0441 \u043e\u0442\u0441\u0443\u0442\u0441\u0442\u0432\u0443\u0435\u0442\n\u0438\u043b\u0438 \u043d\u0435 \u043f\u043e\u0434\u0434\u0430\u0435\u0442\u0441\u044f \u043f\u0440\u043e\u0447\u0442\u0435\u043d\u0438\u044e.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">18.\n\u0412 \u0441\u043b\u0443\u0447\u0430\u0435 \u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0436\u0430\u043b\u043e\u0431\u044b \u0431\u0435\u0437 \u043e\u0442\u0432\u0435\u0442\u0430 \u043f\u043e \u0441\u0443\u0449\u0435\u0441\u0442\u0432\u0443 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044e (\u0435\u0433\u043e \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044e)\n\u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0432 \u0441\u0440\u043e\u043a \u043d\u0435 \u043f\u043e\u0437\u0434\u043d\u0435\u0435 \u0440\u0430\u0431\u043e\u0447\u0435\u0433\u043e \u0434\u043d\u044f, \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0433\u043e \u0437\u0430 \u0434\u043d\u0435\u043c \u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438\n\u0436\u0430\u043b\u043e\u0431\u044b, \u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u043e\u0435 \u043c\u043e\u0442\u0438\u0432\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u043e\u0435 \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u0435 \u0441 \u0443\u043a\u0430\u0437\u0430\u043d\u0438\u0435\u043c \u043e\u0441\u043d\u043e\u0432\u0430\u043d\u0438\u0439 (\u0437\u0430\n\u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435\u043c \u0441\u043b\u0443\u0447\u0430\u0435\u0432, \u043a\u043e\u0433\u0434\u0430 \u0432 \u0436\u0430\u043b\u043e\u0431\u0435 \u043d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d\u044b \u043f\u043e\u0447\u0442\u043e\u0432\u044b\u0439 \u0430\u0434\u0440\u0435\u0441 \u0438 \u0430\u0434\u0440\u0435\u0441\n\u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439 \u043f\u043e\u0447\u0442\u044b \u0434\u043b\u044f \u043e\u0442\u0432\u0435\u0442\u0430 \u0438\u043b\u0438 \u043e\u043d\u0438 \u043d\u0435 \u043f\u043e\u0434\u0434\u0430\u044e\u0442\u0441\u044f \u043f\u0440\u043e\u0447\u0442\u0435\u043d\u0438\u044e). \u0423\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u0435 \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f\n\u0432 \u043f\u043e\u0440\u044f\u0434\u043a\u0435, \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u043e\u043c \u0434\u043b\u044f \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">19.\n\u0416\u0430\u043b\u043e\u0431\u0430, \u043f\u043e\u0434\u0430\u043d\u043d\u0430\u044f \u0441 \u043d\u0430\u0440\u0443\u0448\u0435\u043d\u0438\u0435\u043c \u043f\u0440\u0430\u0432\u0438\u043b \u043e \u043a\u043e\u043c\u043f\u0435\u0442\u0435\u043d\u0446\u0438\u0438, \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u044b\u0445 \u043f\u0443\u043d\u043a\u0442\u043e\u043c\n5.4 \u0410\u0434\u043c\u0438\u043d\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u0430 \u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439\n\u0443\u0441\u043b\u0443\u0433\u0438, \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0432 \u0441\u0440\u043e\u043a \u043d\u0435 \u043f\u043e\u0437\u0434\u043d\u0435\u0435 \u0440\u0430\u0431\u043e\u0447\u0435\u0433\u043e \u0434\u043d\u044f, \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u0433\u043e \u0437\u0430 \u0434\u043d\u0435\u043c \u0435\u0435\n\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u0438, \u0432 \u043e\u0440\u0433\u0430\u043d, \u0443\u043f\u043e\u043b\u043d\u043e\u043c\u043e\u0447\u0435\u043d\u043d\u044b\u0439 \u043d\u0430 \u0440\u0430\u0441\u0441\u043c\u043e\u0442\u0440\u0435\u043d\u0438\u0435 \u0436\u0430\u043b\u043e\u0431\u044b, \u0441 \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u044b\u043c\n\u043f\u0438\u0441\u044c\u043c\u0435\u043d\u043d\u044b\u043c \u0443\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u0435\u043c \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f (\u0435\u0433\u043e \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044f) \u043e \u043f\u0435\u0440\u0435\u0430\u0434\u0440\u0435\u0441\u0430\u0446\u0438\u0438 \u0436\u0430\u043b\u043e\u0431\u044b\n(\u0437\u0430 \u0438\u0441\u043a\u043b\u044e\u0447\u0435\u043d\u0438\u0435\u043c \u0441\u043b\u0443\u0447\u0430\u0435\u0432, \u043a\u043e\u0433\u0434\u0430 \u0432 \u0436\u0430\u043b\u043e\u0431\u0435 \u043d\u0435 \u0443\u043a\u0430\u0437\u0430\u043d\u044b \u043f\u043e\u0447\u0442\u043e\u0432\u044b\u0439 \u0430\u0434\u0440\u0435\u0441 \u0438 \u0430\u0434\u0440\u0435\u0441\n\u044d\u043b\u0435\u043a\u0442\u0440\u043e\u043d\u043d\u043e\u0439 \u043f\u043e\u0447\u0442\u044b \u0434\u043b\u044f \u043e\u0442\u0432\u0435\u0442\u0430 \u0438\u043b\u0438 \u043e\u043d\u0438 \u043d\u0435 \u043f\u043e\u0434\u0434\u0430\u044e\u0442\u0441\u044f \u043f\u0440\u043e\u0447\u0442\u0435\u043d\u0438\u044e). \u0423\u0432\u0435\u0434\u043e\u043c\u043b\u0435\u043d\u0438\u0435\n\u043d\u0430\u043f\u0440\u0430\u0432\u043b\u044f\u0435\u0442\u0441\u044f \u0432 \u043f\u043e\u0440\u044f\u0434\u043a\u0435, \u0443\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u043e\u043c \u0434\u043b\u044f \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u044f \u043f\u043e \u0436\u0430\u043b\u043e\u0431\u0435.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">20.\n\u041f\u043e\u0434\u0430\u0447\u0430 \u0436\u0430\u043b\u043e\u0431\u044b \u0432 \u0434\u043e\u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c (\u0432\u043d\u0435\u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c) \u043f\u043e\u0440\u044f\u0434\u043a\u0435 \u043d\u0435 \u0438\u0441\u043a\u043b\u044e\u0447\u0430\u0435\u0442 \u043f\u0440\u0430\u0432\u0430 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f\n(\u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043b\u044f \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u044f) \u043d\u0430 \u043e\u0434\u043d\u043e\u0432\u0440\u0435\u043c\u0435\u043d\u043d\u0443\u044e \u0438\u043b\u0438 \u043f\u043e\u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0443\u044e \u043f\u043e\u0434\u0430\u0447\u0443 \u0436\u0430\u043b\u043e\u0431\u044b \u0432 \u0441\u0443\u0434.<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">21.\n\u0418\u043d\u0444\u043e\u0440\u043c\u0438\u0440\u043e\u0432\u0430\u043d\u0438\u0435 \u0437\u0430\u044f\u0432\u0438\u0442\u0435\u043b\u0435\u0439 \u043e \u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c \u0438 \u0434\u043e\u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c (\u0432\u043d\u0435\u0441\u0443\u0434\u0435\u0431\u043d\u043e\u043c) \u043f\u043e\u0440\u044f\u0434\u043a\u0435\n\u043e\u0431\u0436\u0430\u043b\u043e\u0432\u0430\u043d\u0438\u044f \u0440\u0435\u0448\u0435\u043d\u0438\u0439 \u0438 (\u0438\u043b\u0438) \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0439 (\u0431\u0435\u0437\u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044f), \u0441\u043e\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044b\u0445 \u043f\u0440\u0438\n\u043f\u0440\u0435\u0434\u043e\u0441\u0442\u0430\u0432\u043b\u0435\u043d\u0438\u0438 \u0433\u043e\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0439 \u0443\u0441\u043b\u0443\u0433\u0438, \u0434\u043e\u043b\u0436\u043d\u043e \u043e\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043b\u044f\u0442\u044c\u0441\u044f \u043f\u0443\u0442\u0435\u043c:<br><\/div><div class=\"MsoNormal\" style=\"text-align: left;\">21.1.\n\u0420\u0430\u0437\u043c\u0435\u0449\u0435\u043d\u0438\u044f \u0441\u043e\u043e\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0443\u044e\u0449\u0435\u0439 \u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u0438 \u043d\u0430 \u041f\u043e\u0440\u0442\u0430\u043b\u0435, \u043e\u0444\u0438\u0446\u0438\u0430\u043b\u044c\u043d\u043e\u043c \u0441\u0430\u0439\u0442\u0435 \u0414\u0435\u043f\u0430\u0440\u0442\u0430\u043c\u0435\u043d\u0442\u0430 \u0432\n\u0438\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0438\u043e\u043d\u043d\u043e-\u0442\u0435\u043b\u0435\u043a\u043e\u043c\u043c\u0443\u043d\u0438\u043a\u0430\u0446\u0438\u043e\u043d\u043d\u043e\u0439 \u0441\u0435\u0442\u0438 \u0418\u043d\u0442
