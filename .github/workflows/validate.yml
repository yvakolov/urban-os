name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Зависимостей нет намеренно: инструмент должен запускаться где угодно
      # без установки чего-либо. Если здесь однажды появится pip install —
      # это повод пересмотреть решение, а не добавить строку.
      - name: Целостность реестра требований
        run: python3 tools/validate.py

      - name: Тесты мониторинга
        run: python3 -m unittest discover tests -v
