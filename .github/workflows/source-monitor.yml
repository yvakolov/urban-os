name: source-monitor

on:
  workflow_dispatch:
  schedule:
    # понедельник, 06:00 UTC
    - cron: "0 6 * * 1"

# Одновременный weekly и ручной запуск создали бы два одинаковых issue.
concurrency:
  group: source-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка официальных источников
        id: check
        run: python3 tools/check_sources.py --report reports/source-check.json

      - name: Отчёт как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check
          path: reports/source-check.json
          retention-days: 90

      # Issue создаётся только на CHANGED. Технический сбой сюда не попадает:
      # недоступность сайта не является событием нормативного контроля.
      - name: Уведомление об изменении источника
        run: python3 tools/notify_github.py reports/source-check.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Итог в лог сборки
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("reports/source-check.json")
          if not p.exists():
              print("отчёта нет — проверка не дошла до конца"); raise SystemExit(0)
          for e in json.loads(p.read_text(encoding="utf-8"))["events"]:
              print(f"{e['sourceId']}: {e['event']} · {e['classification']}")
              if e.get("detail"):
                  print(f"    {e['detail']}")
          PY

# Чего эта джоба не делает и делать не должна:
#   - не коммитит новые requirements;
#   - не обновляет baseline;
#   - не решает, является ли изменение юридически значимым.
# Всё это — работа человека после просмотра diff.
