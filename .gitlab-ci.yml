image: python:3.12-slim

validate:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - python3 tools/validate.py
    - python3 tools/build_graph.py --check
    - python3 -m unittest discover tests

source-monitor:
  resource_group: source-monitor
  # По расписанию — сам; из интерфейса «Run pipeline» — вручную.
  # Голый `when: manual` без условия навешивал бы ручную задачу на каждый push.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  script:
    - python3 tools/check_sources.py --report reports/source-check.json
    - python3 tools/notify_gitlab.py reports/source-check.json
  artifacts:
    when: always
    paths:
      - reports/source-check.json
    expire_in: 90 days
